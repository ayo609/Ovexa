<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Ovexa — Create Account</title>

<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta name="theme-color" content="#070B14">

<style>
:root{
  --ov-bg:#070B14;
  --ov-panel:#0F1524;
  --ov-panel-2:#141B2E;
  --ov-line:rgba(255,255,255,0.07);
  --ov-line-2:rgba(255,255,255,0.12);
  --ov-text:#EEF3FF;
  --ov-muted:#7C87A3;
  --ov-muted-2:#5A6478;
  --ov-accent:#3EE8A8;
  --ov-accent-2:#19B98B;
  --ov-gold:#F4C97A;
  --ov-danger:#FF6B7A;
  --ov-blue:#5B8DEF;
}
html,body{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--ov-bg);color:var(--ov-text)}
*,*::before,*::after{box-sizing:inherit}
body{display:flex;flex-direction:column;min-height:100vh;position:relative;overflow-x:hidden}

/* ============ AMBIENT BACKGROUND ============ */
.ov-bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(1200px 600px at 50% -10%,rgba(62,232,168,0.10),transparent 60%),
  radial-gradient(900px 500px at 100% 100%,rgba(91,141,239,0.08),transparent 60%),
  linear-gradient(180deg,#070B14 0%,#0A0F1C 100%)}
.ov-grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%)}
.ov-orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.5;will-change:transform}
.ov-orb-a{width:460px;height:460px;background:radial-gradient(circle,rgba(62,232,168,0.9) 0%,transparent 70%);top:-160px;right:-160px;animation:ovFloatA 14s ease-in-out infinite}
.ov-orb-b{width:420px;height:420px;background:radial-gradient(circle,rgba(91,141,239,0.8) 0%,transparent 70%);bottom:-180px;left:-140px;animation:ovFloatB 18s ease-in-out infinite}
.ov-orb-c{width:320px;height:320px;background:radial-gradient(circle,rgba(244,201,122,0.35) 0%,transparent 70%);top:40%;left:60%;animation:ovFloatA 22s ease-in-out infinite reverse}
@keyframes ovFloatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,32px) scale(1.08)}}
@keyframes ovFloatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-24px) scale(1.1)}}
.ov-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.5) 100%);pointer-events:none}

/* ============ SHELL ============ */
.ov-shell{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;position:relative;z-index:1;padding:0 0 40px}

/* ============ TOP BANNER (ovexa.jpg) ============ */
.ov-banner{position:relative;width:100%;height:170px;overflow:hidden;background:#0A0F1C;animation:ovBannerIn .9s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes ovBannerIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.ov-banner img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:brightness(0.92) saturate(1.05)}
.ov-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,0.25) 0%,rgba(7,11,20,0.55) 60%,rgba(7,11,20,1) 100%);pointer-events:none}
.ov-banner-inner{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:14px 20px;z-index:2}
.ov-banner-link{font-size:11.5px;font-weight:700;letter-spacing:0.4px;color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;background:rgba(7,11,20,0.65);border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(10px);transition:all .25s;display:inline-flex;align-items:center;gap:6px}
.ov-banner-link:hover{background:rgba(62,232,168,0.18);border-color:rgba(62,232,168,0.5);color:var(--ov-accent)}
.ov-banner-brand{position:absolute;top:14px;left:20px;z-index:2;font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-0.7px;background:linear-gradient(120deg,#FFFFFF 0%,#B8F3DA 55%,#3EE8A8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ============ CONTENT AREA ============ */
.ov-content{padding:0 20px;margin-top:-40px;position:relative;z-index:3}

/* ============ HEADING ============ */
.ov-heading{text-align:center;animation:ovFadeUp .8s cubic-bezier(.2,.9,.3,1.1) .1s both}
.ov-heading h1{font-family:'Space Grotesk';font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-1px;margin:0 0 12px;background:linear-gradient(120deg,#FFFFFF 0%,#B8F3DA 55%,#3EE8A8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
.ov-heading .ov-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.ov-heading .ov-divider span{height:1px;width:60px;background:linear-gradient(90deg,transparent,rgba(244,201,122,0.6),transparent)}
.ov-heading .ov-divider i{width:6px;height:6px;border-radius:50%;background:var(--ov-gold);box-shadow:0 0 12px rgba(244,201,122,0.8)}
@keyframes ovFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ============ CIRCULAR BADGE ============ */
.ov-badge-wrap{display:flex;justify-content:center;margin-bottom:22px;animation:ovFadeUp .9s cubic-bezier(.2,.9,.3,1.1) .15s both}
.ov-badge-ring{position:relative;width:104px;height:104px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,#F4C97A,#3EE8A8,#19B98B,#F4C97A);box-shadow:0 16px 40px rgba(62,232,168,0.35),0 0 0 4px rgba(7,11,20,0.85)}
.ov-badge-ring::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(244,201,122,0.35);animation:ovRotate 20s linear infinite;pointer-events:none}
@keyframes ovRotate{to{transform:rotate(360deg)}}
.ov-badge-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0A0F1C;display:grid;place-items:center}
.ov-badge-inner img{width:100%;height:100%;object-fit:cover;display:block}

/* ============ BONUS STRIP ============ */
.ov-bonus{position:relative;margin-bottom:22px;display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,rgba(62,232,168,0.10) 0%,rgba(244,201,122,0.05) 100%);border:1px solid rgba(62,232,168,0.22);overflow:hidden;animation:ovFadeUp 1s cubic-bezier(.2,.9,.3,1.1) .2s both}
.ov-bonus::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.10) 50%,transparent 70%);transform:translateX(-100%);animation:ovSweep 3.5s ease-in-out infinite}
@keyframes ovSweep{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
.ov-bonus-icon{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:linear-gradient(145deg,rgba(62,232,168,0.24),rgba(62,232,168,0.08));display:grid;place-items:center;color:var(--ov-accent);font-size:20px;border:1px solid rgba(62,232,168,0.25);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}
.ov-bonus-title{font-size:12.5px;font-weight:700;color:var(--ov-text);margin:0 0 3px;letter-spacing:-0.1px}
.ov-bonus-sub{font-size:11px;color:var(--ov-muted);margin:0}
.ov-bonus-amt{margin-left:auto;font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--ov-accent);white-space:nowrap;text-shadow:0 0 20px rgba(62,232,168,0.5)}

/* ============ CARD ============ */
.ov-card{position:relative;background:linear-gradient(180deg,rgba(20,27,46,0.80),rgba(15,21,36,0.92));border:1px solid var(--ov-line);border-radius:24px;padding:24px 20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 70px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);animation:ovFadeUp 1s cubic-bezier(.2,.9,.3,1.1) .25s both;overflow:hidden}
.ov-card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(62,232,168,0.6),transparent)}

/* Referral banner */
.ov-ref-banner{display:none;align-items:center;gap:11px;padding:12px 14px;margin-bottom:18px;border-radius:13px;background:linear-gradient(120deg,rgba(244,201,122,0.10),rgba(244,201,122,0.03));border:1px solid rgba(244,201,122,0.25)}
.ov-ref-banner.show{display:flex;animation:ovFadeUp .5s ease both}
.ov-ref-banner i{color:var(--ov-gold);font-size:18px}
.ov-ref-banner span{font-size:11.5px;color:#E8CF9B;font-weight:600}
.ov-ref-banner strong{color:var(--ov-gold);font-weight:800;letter-spacing:0.5px}

/* ============ FIELDS ============ */
.ov-field{position:relative;margin-bottom:14px}
.ov-field .ov-label{position:absolute;top:50%;left:48px;transform:translateY(-50%);font-size:13.5px;font-weight:500;color:var(--ov-muted);pointer-events:none;transition:all .22s cubic-bezier(.2,.9,.3,1.2);padding:0 6px}
.ov-field input{width:100%;height:56px;padding:0 46px 0 48px;background:rgba(7,11,20,0.75);border:1.5px solid var(--ov-line);border-radius:14px;font-family:'Inter';font-size:13.5px;font-weight:500;color:var(--ov-text);outline:none;transition:all .25s}
.ov-field input::placeholder{color:transparent}
.ov-field input:hover{border-color:var(--ov-line-2)}
.ov-field input:focus{border-color:var(--ov-accent);background:rgba(7,11,20,0.95);box-shadow:0 0 0 4px rgba(62,232,168,0.10),0 8px 24px rgba(62,232,168,0.08)}
.ov-field input:focus + .ov-label,
.ov-field input:not(:placeholder-shown) + .ov-label{top:0;left:16px;font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--ov-accent);background:var(--ov-panel);padding:0 7px;border-radius:4px}
.ov-field .ov-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--ov-muted);font-size:1.15rem;pointer-events:none;transition:color .25s,transform .25s}
.ov-field input:focus ~ .ov-icon{color:var(--ov-accent);transform:translateY(-50%) scale(1.05)}

/* Phone with +234 prefix */
.ov-field.phone input{padding-left:88px}
.ov-field.phone .ov-prefix{position:absolute;left:46px;top:50%;transform:translateY(-50%);font-family:'Space Grotesk';font-size:13.5px;font-weight:700;color:var(--ov-accent);pointer-events:none;letter-spacing:0.4px}
.ov-field.phone .ov-prefix::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:1px;height:20px;background:rgba(255,255,255,0.1)}

/* Trade password gold accent */
.ov-field.trade input{background:linear-gradient(90deg,rgba(244,201,122,0.05),rgba(7,11,20,0.75));border-color:rgba(244,201,122,0.18)}
.ov-field.trade input:focus{border-color:var(--ov-gold);box-shadow:0 0 0 4px rgba(244,201,122,0.10),0 8px 24px rgba(244,201,122,0.08)}
.ov-field.trade input:focus ~ .ov-icon{color:var(--ov-gold)}
.ov-field.trade input:focus + .ov-label,
.ov-field.trade input:not(:placeholder-shown) + .ov-label{color:var(--ov-gold)}

/* Referral gold */
.ov-field.referral input{background:linear-gradient(90deg,rgba(244,201,122,0.05),rgba(7,11,20,0.75));border-color:rgba(244,201,122,0.18)}
.ov-field.referral input:focus{border-color:var(--ov-gold);box-shadow:0 0 0 4px rgba(244,201,122,0.10),0 8px 24px rgba(244,201,122,0.08)}
.ov-field.referral input:focus ~ .ov-icon{color:var(--ov-gold)}
.ov-field.referral input:focus + .ov-label,
.ov-field.referral input:not(:placeholder-shown) + .ov-label{color:var(--ov-gold)}

.ov-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ov-muted);cursor:pointer;padding:9px;font-size:1.1rem;border-radius:10px;transition:all .2s;display:grid;place-items:center}
.ov-eye:hover{color:var(--ov-accent);background:rgba(62,232,168,0.08)}
.ov-field.trade .ov-eye:hover{color:var(--ov-gold);background:rgba(244,201,122,0.08)}

.ov-ref-status{position:absolute;right:44px;top:50%;transform:translateY(-50%);font-size:1rem;display:none;pointer-events:none}
.ov-ref-status.valid{color:var(--ov-accent);display:block}
.ov-ref-status.invalid{color:var(--ov-danger);display:block}
.ov-ref-status.checking{color:var(--ov-gold);display:block;animation:ovSpin 1s linear infinite}

.ov-hint{font-size:10.5px;font-weight:600;margin:6px 0 0 6px;display:none;letter-spacing:0.2px}
.ov-hint.error{color:var(--ov-danger);display:block}
.ov-hint.success{color:var(--ov-accent);display:block}

/* ============ CODE / CAPTCHA SECTION ============ */
.ov-code-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch;margin-bottom:14px}
.ov-code-input-wrap{position:relative}
.ov-code-input-wrap input{width:100%;height:56px;padding:0 16px;background:rgba(7,11,20,0.75);border:1.5px solid var(--ov-line);border-radius:14px;font-family:'Space Grotesk';font-size:15px;font-weight:700;color:var(--ov-text);outline:none;transition:all .25s;letter-spacing:2px;text-align:center}
.ov-code-input-wrap input::placeholder{letter-spacing:0.5px;color:var(--ov-muted-2);font-weight:500;font-family:'Inter';font-size:12.5px}
.ov-code-input-wrap input:focus{border-color:var(--ov-accent);background:rgba(7,11,20,0.95);box-shadow:0 0 0 4px rgba(62,232,168,0.10)}
.ov-captcha{display:grid;place-items:center;min-width:130px;height:56px;border-radius:14px;background:linear-gradient(135deg,rgba(244,201,122,0.15),rgba(62,232,168,0.10));border:1.5px solid rgba(244,201,122,0.35);position:relative;overflow:hidden;cursor:pointer;user-select:none;padding:0 14px}
.ov-captcha::before{content:'';position:absolute;inset:0;background-image:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,0.08) 1px,transparent 1.5px),
  radial-gradient(circle at 70% 60%,rgba(255,255,255,0.06) 1px,transparent 1.5px),
  radial-gradient(circle at 45% 80%,rgba(255,255,255,0.06) 1px,transparent 1.5px);
  background-size:18px 18px,22px 22px,26px 26px;pointer-events:none}
.ov-captcha-text{font-family:'Space Grotesk';font-size:26px;font-weight:800;letter-spacing:6px;color:var(--ov-gold);text-shadow:0 0 20px rgba(244,201,122,0.5);position:relative;z-index:1;transform:rotate(-2deg)}
.ov-captcha-text span{display:inline-block;transform:rotate(var(--r,0deg))}
.ov-captcha-refresh{position:absolute;top:4px;right:6px;font-size:12px;color:var(--ov-muted);background:rgba(7,11,20,0.4);border-radius:6px;padding:2px 6px;cursor:pointer;z-index:2;transition:color .2s,transform .3s}
.ov-captcha-refresh:hover{color:var(--ov-accent);transform:rotate(180deg)}
.ov-code-hint{font-size:10.5px;color:var(--ov-muted);font-weight:500;margin:-8px 0 14px 4px;display:flex;align-items:center;gap:5px}
.ov-code-hint i{color:var(--ov-accent);font-size:12px}
.ov-code-hint a{color:var(--ov-gold);font-weight:700;text-decoration:none;cursor:pointer}
.ov-code-hint a:hover{text-decoration:underline}

/* ============ BUTTON ============ */
.ov-btn{position:relative;width:100%;height:56px;margin-top:6px;border:none;border-radius:14px;background:linear-gradient(135deg,#3EE8A8 0%,#19B98B 55%,#0E8E68 100%);background-size:200% 100%;color:#04261A;font-family:'Inter';font-size:14px;font-weight:800;letter-spacing:0.4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .3s;box-shadow:0 14px 30px rgba(62,232,168,0.30),inset 0 1px 0 rgba(255,255,255,0.3);overflow:hidden}
.ov-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.35) 50%,transparent 70%);transform:translateX(-100%);transition:transform .8s}
.ov-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 20px 40px rgba(62,232,168,0.42),inset 0 1px 0 rgba(255,255,255,0.35);background-position:100% 50%}
.ov-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.ov-btn:active:not(:disabled){transform:translateY(0) scale(0.995)}
.ov-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* Login button (bottom) */
.ov-login-btn{position:relative;width:100%;height:54px;margin-top:12px;border-radius:14px;background:rgba(255,255,255,0.03);border:1.5px solid var(--ov-line-2);color:var(--ov-text);font-family:'Inter';font-size:13.5px;font-weight:800;letter-spacing:0.4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .25s;text-decoration:none}
.ov-login-btn:hover{background:rgba(91,141,239,0.10);border-color:rgba(91,141,239,0.4);color:var(--ov-blue);transform:translateY(-1px)}
.ov-login-btn i{font-size:1.15rem}

.ov-spinner{width:16px;height:16px;border:2.5px solid rgba(4,38,26,0.25);border-top-color:#04261A;border-radius:50%;animation:ovSpin .7s linear infinite;display:inline-block}
@keyframes ovSpin{to{transform:rotate(360deg)}}

/* ============ FOOTER ============ */
.ov-foot{margin-top:auto;padding-top:24px;text-align:center;animation:ovFadeUp 1.1s cubic-bezier(.2,.9,.3,1.1) .35s both}
.ov-secure{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--ov-muted-2);font-weight:700;letter-spacing:0.6px;text-transform:uppercase}
.ov-secure i{color:var(--ov-accent);font-size:13px}

/* ============ TOASTS ============ */
#ov-toast-container{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.ov-toast{background:linear-gradient(180deg,rgba(20,27,46,0.98),rgba(15,21,36,0.98));border:1px solid var(--ov-line-2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,0.6);display:flex;align-items:flex-start;padding:14px 15px;pointer-events:auto;transform:translateY(-28px) scale(0.96);opacity:0;transition:all .45s cubic-bezier(.68,-.55,.265,1.55);backdrop-filter:blur(14px)}
.ov-toast.show{transform:translateY(0) scale(1);opacity:1}
.ov-toast-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px;margin-right:12px;flex-shrink:0}
.ov-toast-body{flex:1;min-width:0}
.ov-toast-title{font-size:12.5px;font-weight:800;color:var(--ov-text);margin-bottom:3px;letter-spacing:0.2px}
.ov-toast-msg{font-size:11.5px;color:var(--ov-muted);line-height:1.5;word-wrap:break-word}
.ov-toast-close{background:none;border:none;color:var(--ov-muted-2);font-size:13px;cursor:pointer;padding:3px;border-radius:6px;transition:color .2s}
.ov-toast-close:hover{color:var(--ov-text)}

@media(max-width:380px){
  .ov-banner{height:150px}
  .ov-heading h1{font-size:24px}
  .ov-content{padding:0 15px}
  .ov-card{padding:20px 15px;border-radius:20px}
  .ov-field input{height:54px;font-size:13px}
  .ov-field.phone input{padding-left:86px}
  .ov-btn,.ov-login-btn{height:52px}
  .ov-captcha{min-width:110px}
  .ov-captcha-text{font-size:22px;letter-spacing:5px}
}
</style>
</head>
<body>

<div class="ov-bg-layer">
  <div class="ov-grid"></div>
  <div class="ov-orb ov-orb-a"></div>
  <div class="ov-orb ov-orb-b"></div>
  <div class="ov-orb ov-orb-c"></div>
  <div class="ov-vignette"></div>
</div>

<main class="ov-shell">

  <!-- TOP BANNER with ovexa.jpg -->
  <div class="ov-banner">
    <img src="ovexa.png" alt="Ovexa" onerror="this.style.display='none'">
    <div class="ov-banner-brand">Ovexa</div>
    <div class="ov-banner-inner">
      <a href="login.html" class="ov-banner-link"><i class="ph ph-sign-in"></i> Sign In</a>
    </div>
  </div>

  <div class="ov-content">

    <!-- HEADING -->
    <div class="ov-heading">
      <h1>Invite Register</h1>
      <div class="ov-divider"><span></span><i></i><span></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, increment, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqXdfRRQZbbrB4DIpTAj45FkxJsXm3JrM",
  authDomain: "vexa-c0868.firebaseapp.com",
  projectId: "vexa-c0868",
  storageBucket: "vexa-c0868.firebasestorage.app",
  messagingSenderId: "209201666488",
  appId: "1:209201666488:web:ae6d16fec94097e719174d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window._auth = auth;
window._db = db;
window._fbFns = { doc, setDoc, getDoc, updateDoc, arrayUnion, increment, serverTimestamp, runTransaction, createUserWithEmailAndPassword };
window._firebaseReady = true;

async function detectReferralFromURL(){
  const p = new URLSearchParams(window.location.search);
  const r = p.get('ref');
  if(!r) return;
  const code = r.trim().toUpperCase();
  try{
    const snap = await getDoc(doc(db,'users',code));
    if(snap.exists()){
      document.getElementById('referralCode').value = code;
      const st = document.getElementById('ovRefStatus');
      st.className = 'ov-ref-status valid';
      st.innerHTML = '<i class="ph ph-check-circle"></i>';
      const h = document.getElementById('referralHint');
      h.textContent = '✓ Verified referral code';
      h.className = 'ov-hint success';
      document.getElementById('ovRefBanner').classList.add('show');
      document.getElementById('ovRefBannerName').textContent = code;
      window._detectedReferral = code;
    } else {
      window._detectedReferral = null;
    }
  }catch(e){
    console.warn('Referral lookup failed:', e);
    window._detectedReferral = null;
  }
}
window._detectedReferral = null;
detectReferralFromURL();
console.log('✅ Ovexa Firebase ready');
</script>

<script>
"use strict";

// ================== TOASTS ==================
function ovNotify(type, message){
  let container = document.getElementById('ov-toast-container');
  if(!container){ container = document.createElement('div'); container.id = 'ov-toast-container'; document.body.appendChild(container); }
  const themes = {
    success:{ icon:'fa-solid fa-check-double', color:'#3EE8A8', bg:'rgba(62,232,168,0.12)', title:'Success' },
    error:{ icon:'fa-solid fa-circle-exclamation', color:'#FF6B7A', bg:'rgba(255,107,122,0.12)', title:'Error' },
    warning:{ icon:'fa-solid fa-triangle-exclamation', color:'#F4C97A', bg:'rgba(244,201,122,0.12)', title:'Warning' },
    info:{ icon:'fa-solid fa-bell', color:'#5B8DEF', bg:'rgba(91,141,239,0.12)', title:'Info' }
  };
  const th = themes[type] || themes.info;
  const toast = document.createElement('div');
  toast.className = 'ov-toast';
  toast.style.borderLeft = `3px solid ${th.color}`;
  toast.innerHTML = `
    <div class="ov-toast-icon" style="color:${th.color};background:${th.bg}"><i class="${th.icon}"></i></div>
    <div class="ov-toast-body">
      <div class="ov-toast-title">${th.title}</div>
      <div class="ov-toast-msg">${message}</div>
    </div>
    <button class="ov-toast-close" onclick="this.closest('.ov-toast').remove()"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(toast);
  setTimeout(()=>toast.classList.add('show'), 10);
  setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(), 350); }, 5200);
}

// ================== PASSWORD TOGGLES ==================
document.querySelectorAll('.ov-eye').forEach(btn => {
  btn.addEventListener('click', function(){
    const id = this.dataset.target;
    const inp = document.getElementById(id);
    const ic = this.querySelector('i');
    if(!inp || !ic) return;
    if(inp.type === 'password'){ inp.type = 'text'; ic.className = 'ph ph-eye-slash'; }
    else { inp.type = 'password'; ic.className = 'ph ph-eye'; }
  });
});

// ================== PHONE VALIDATION ==================
document.getElementById('phone').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,11);
  const v = this.value.trim(), h = document.getElementById('phoneHint');
  if(!v){ h.className='ov-hint'; return; }
  const ok = /^(070|080|081|090|091|0700|0701|0702|0703|0704|0705|0706|0707|0708|0810|0811|0812|0813|0814|0815|0816|0817|0818|0900|0901|0902|0903|0904|0905|0906|0907|0908|0909|0910|0911|0912|0913|0914|0915|0916)\d{7,8}$/.test(v);
  // Simpler accurate check: 11 digits starting with known prefix
  const ok2 = /^(070|080|081|090|091)\d{8}$/.test(v);
  h.textContent = ok2 ? '✓ Valid Nigerian number' : 'Enter 11 digits starting 070/080/081/090/091';
  h.className = 'ov-hint ' + (ok2 ? 'success' : 'error');
});

// ================== EMAIL VALIDATION ==================
document.getElementById('email').addEventListener('input', function(){
  const v = this.value.trim(), h = document.getElementById('emailHint');
  if(!v){ h.className='ov-hint'; return; }
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  h.textContent = ok ? '✓ Valid email' : 'Enter a valid email address';
  h.className = 'ov-hint ' + (ok ? 'success' : 'error');
});

// ================== USERNAME VALIDATION ==================
document.getElementById('username').addEventListener('input', function(){
  const v = this.value.trim(), h = document.getElementById('usernameHint');
  const ok = /^[a-zA-Z]{4,20}$/.test(v);
  if(!v){ h.className='ov-hint'; return; }
  h.textContent = ok ? '✓ Looks good' : 'Letters only, 4–20 characters';
  h.className = 'ov-hint ' + (ok ? 'success' : 'error');
});

// ================== PASSWORD VALIDATION ==================
document.getElementById('password').addEventListener('input', function(){
  const v = this.value, h = document.getElementById('passwordHint');
  if(!v){ h.className='ov-hint'; return; }
  const ok = v.length >= 6;
  h.textContent = v.length < 6 ? 'Minimum 6 characters' : (v.length < 8 ? '✓ Acceptable' : '✓ Strong password');
  h.className = 'ov-hint ' + (ok ? 'success' : 'error');
});
document.getElementById('confirmPassword').addEventListener('input', function(){
  const v = this.value, pass = document.getElementById('password').value, h = document.getElementById('confirmPasswordHint');
  if(!v){ h.className='ov-hint'; return; }
  const ok = v === pass;
  h.textContent = ok ? '✓ Passwords match' : '✗ Passwords do not match';
  h.className = 'ov-hint ' + (ok ? 'success' : 'error');
});

// ================== TRADE PASSWORD VALIDATION ==================
document.getElementById('tradePassword').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,6);
  const v = this.value, h = document.getElementById('tradePasswordHint');
  if(!v){ h.className='ov-hint'; return; }
  const ok = /^\d{6}$/.test(v);
  h.textContent = ok ? '✓ 6-digit code ready' : `${v.length}/6 digits`;
  h.className = 'ov-hint ' + (ok ? 'success' : 'error');
});

// ================== REFERRAL VALIDATION ==================
document.getElementById('referralCode').addEventListener('input', function(){
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20);
  const v = this.value.trim(), h = document.getElementById('referralHint'), st = document.getElementById('ovRefStatus');
  if(!v){ h.className='ov-hint'; st.className='ov-ref-status'; st.innerHTML=''; return; }
  st.className = 'ov-ref-status checking';
  st.innerHTML = '<i class="ph ph-circle-notch"></i>';
  h.textContent = 'Checking referral code…';
  h.className = 'ov-hint';
});

// ================== CAPTCHA / CODE ==================
let currentCode = '';
function generateCode(){
  let code = '';
  for(let i=0;i<4;i++) code += Math.floor(Math.random()*10);
  currentCode = code;
  const el = document.getElementById('ovCaptchaText');
  // Add random rotations to each digit for anti-bot look
  el.innerHTML = code.split('').map(d => {
    const r = (Math.random()*14 - 7).toFixed(1);
    return `<span style="--r:${r}deg">${d}</span>`;
  }).join('');
  // Reset input
  const inp = document.getElementById('captchaInput');
  if(inp) inp.value = '';
}
document.getElementById('ovCaptchaRefresh').addEventListener('click', (e) => {
  e.stopPropagation();
  generateCode();
  ovNotify('info','New code generated');
});
document.getElementById('ovCaptcha').addEventListener('click', () => {
  generateCode();
  ovNotify('info','New code generated');
});
document.getElementById('ovNewCodeLink').addEventListener('click', () => {
  generateCode();
  ovNotify('info','New code generated');
});
generateCode();

// ================== SIGNUP ==================
function setLoading(l){
  const b = document.getElementById('ovSignupBtn'), t = document.getElementById('ovBtnText');
  b.disabled = l;
  t.innerHTML = l ? '<span class="ov-spinner"></span> Creating Account…' : 'Register';
}

async function handleSignup(){
  if(!window._firebaseReady || !window._db || !window._auth){
    return ovNotify('info','App is still loading, please wait…');
  }

  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const username = document.getElementById('username').value.trim().toUpperCase();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const tradePassword = document.getElementById('tradePassword').value.trim();
  const refCode = (window._detectedReferral || document.getElementById('referralCode').value.trim()).toUpperCase();
  const captchaInput = document.getElementById('captchaInput').value.trim();

  // Validations
  if(!phone || !email || !username || !password || !confirmPassword || !tradePassword || !captchaInput){
    return ovNotify('error','Please fill in all required fields.');
  }
  if(!/^(070|080|081|090|091)\d{8}$/.test(phone)) return ovNotify('error','Enter a valid Nigerian phone number.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return ovNotify('error','Please enter a valid email address.');
  if(!/^[a-zA-Z]{4,20}$/.test(username)) return ovNotify('error','Username: letters only, 4–20 characters.');
  if(password.length < 6) return ovNotify('error','Password must be at least 6 characters.');
  if(password !== confirmPassword) return ovNotify('error','Passwords do not match.');
  if(!/^\d{6}$/.test(tradePassword)) return ovNotify('error','Trade password must be exactly 6 digits.');
  if(tradePassword === password) return ovNotify('error','Trade password must differ from login password.');
  if(refCode && refCode === username) return ovNotify('error','You cannot refer yourself.');
  if(captchaInput !== currentCode) return ovNotify('error','The code you entered is incorrect. Please try again.');

  setLoading(true);

  const WELCOME_BONUS = 500;
  const { doc, setDoc, getDoc, updateDoc, arrayUnion, increment, serverTimestamp, runTransaction, createUserWithEmailAndPassword } = window._fbFns;
  const db = window._db, auth = window._auth;

  try{
    // Referral validation
    let finalReferrer = null;
    if(refCode){
      const rs = await getDoc(doc(db,'users',refCode));
      if(!rs.exists()){ setLoading(false); return ovNotify('error','Referral code not found.'); }
      finalReferrer = refCode;
    }

    // Username uniqueness
    const us = await getDoc(doc(db,'users',username));
    if(us.exists()){ setLoading(false); return ovNotify('error','Username already taken. Please choose another.'); }

    // Create auth user
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    // Build user doc — includes trade password hash-ready field
    const userData = {
      uid, email, phone, username,
      ownReferralCode: username,
      referredBy: finalReferrer || '',
      // trade password stored (in production should be hashed — see note below)
      tradePassword,
      depositWallet: WELCOME_BONUS,
      withdrawalWallet: 0,
      totalDeposited: 0,
      totalWithdrawn: 0,
      totalEarnings: 0,
      referralBonus: 0,
      referralCount: 0,
      isAdmin: false,
      isActive: true,
      accountStatus: 'active',
      createdAt: serverTimestamp(),
      lastLogin: serverTimestamp(),
      registrationDate: new Date().toISOString()
    };
    await setDoc(doc(db,'users',username), userData);
    await setDoc(doc(db,'usersByUid',uid), { username, email, referredBy: finalReferrer || '' });

    // Referral stats
    if(finalReferrer){
      const rsRef = doc(db,'referralStats',finalReferrer);
      await runTransaction(db, async (tx)=>{
        const rss = await tx.get(rsRef);
        if(rss.exists()){
          tx.update(rsRef, {
            referrals: arrayUnion(username),
            referralCount: increment(1),
            lastReferralAt: serverTimestamp()
          });
        } else {
          tx.set(rsRef, {
            username: finalReferrer,
            referrals: [username],
            referralCount: 1,
            totalReferralBonus: 0,
            createdAt: serverTimestamp(),
            lastReferralAt: serverTimestamp()
          });
        }
      });
      await updateDoc(doc(db,'users',finalReferrer), { referralCount: increment(1) });
    }

    // Sub-collections
    await setDoc(doc(db,'transactionHistory',username), { username, transactions:[], createdAt: serverTimestamp() });
    await setDoc(doc(db,'investments',username), { username, activeInvestments:[], totalInvested:0, totalReturns:0, createdAt: serverTimestamp() });

    // Session
    sessionStorage.setItem('userLoggedIn','true');
    sessionStorage.setItem('userEmail', email);
    sessionStorage.setItem('userUid', uid);
    sessionStorage.setItem('username', username);
    sessionStorage.setItem('userData', JSON.stringify({
      username, email,
      depositWallet: WELCOME_BONUS,
      withdrawalWallet: 0,
      totalDeposited: 0,
      totalWithdrawn: 0,
      referralCount: 0,
      referralBonus: 0,
      activePlan: '',
      isAdmin: false
    }));

    ovNotify('success', finalReferrer
      ? `🎉 Welcome to Ovexa! ₦${WELCOME_BONUS} credited to your deposit wallet. Referred by ${finalReferrer}.`
      : `🎉 Welcome to Ovexa! ₦${WELCOME_BONUS} credited to your deposit wallet.`
    );

    setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 2000);

  }catch(err){
    setLoading(false);
    console.error('❌ Signup error:', err);
    const messages = {
      'auth/email-already-in-use':'This email is already registered. Try signing in instead.',
      'auth/invalid-email':'That email address looks invalid.',
      'auth/weak-password':'Password is too weak. Use at least 6 characters.',
      'auth/network-request-failed':'Network error. Check your connection and try again.',
      'auth/too-many-requests':'Too many attempts. Please wait a moment and try again.'
    };
    ovNotify('error', messages[err.code] || err.message || 'Something went wrong. Please try again.');
  }
}

document.getElementById('ovSignupBtn').addEventListener('click', function(e){
  e.preventDefault();
  handleSignup();
});
document.getElementById('ovSignupForm').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); handleSignup(); }
});

// Auto-capitalize referral code input while typing
document.getElementById('referralCode').addEventListener('blur', function(){
  this.value = this.value.trim().toUpperCase();
});

window.handleSignup = handleSignup;
window.ovNotify = ovNotify;
console.log('✅ Ovexa register ready — premium UI | 2 wallets | ₦500 → deposit | code check | no .limit()');
</script>
