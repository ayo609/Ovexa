<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Ovexa — Transaction History</title>

<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta name="theme-color" content="#070B14">

<style>
:root{
  --ov-bg:#070B14;
  --ov-panel:#0F1524;
  --ov-panel-2:#141B2E;
  --ov-line:rgba(255,255,255,0.07);
  --ov-line-2:rgba(255,255,255,0.12);
  --ov-text:#EEF3FF;
  --ov-muted:#7C87A3;
  --ov-muted-2:#5A6478;
  --ov-accent:#3EE8A8;
  --ov-accent-2:#19B98B;
  --ov-accent-deep:#0E8E68;
  --ov-gold:#F4C97A;
  --ov-danger:#FF6B7A;
  --ov-blue:#5B8DEF;
  --ov-pink:#FF8FB1;
  --ov-purple:#B98BFF;
}
html,body{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--ov-bg);color:var(--ov-text)}
*,*::before,*::after{box-sizing:inherit}
body{display:flex;flex-direction:column;min-height:100vh;position:relative;overflow-x:hidden;padding-bottom:88px}

/* BACKGROUND */
.ov-bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(1200px 600px at 50% -10%,rgba(62,232,168,0.08),transparent 60%),
  radial-gradient(900px 500px at 100% 100%,rgba(91,141,239,0.07),transparent 60%),
  linear-gradient(180deg,#070B14 0%,#0A0F1C 100%)}
.ov-grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 50% 15%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 15%,#000 30%,transparent 75%)}
.ov-orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.42;will-change:transform}
.ov-orb-a{width:420px;height:420px;background:radial-gradient(circle,rgba(62,232,168,0.9) 0%,transparent 70%);top:-150px;right:-150px;animation:ovFloatA 16s ease-in-out infinite}
.ov-orb-b{width:400px;height:400px;background:radial-gradient(circle,rgba(91,141,239,0.8) 0%,transparent 70%);bottom:-180px;left:-140px;animation:ovFloatB 20s ease-in-out infinite}
@keyframes ovFloatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,32px) scale(1.08)}}
@keyframes ovFloatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-24px) scale(1.1)}}
.ov-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.45) 100%);pointer-events:none}

/* SHELL */
.ov-shell{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;position:relative;z-index:1;padding:0 18px}

/* TOP BAR */
.ov-topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 18px;animation:ovSlideDown .6s cubic-bezier(.2,.9,.3,1.2) both;position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(7,11,20,0.95),rgba(7,11,20,0.7) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:22px;padding-bottom:14px}
.ov-top-left{display:flex;align-items:center;gap:12px}
.ov-back-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,0.03);border:1px solid var(--ov-line);display:grid;place-items:center;color:var(--ov-muted);font-size:1.15rem;cursor:pointer;transition:all .22s;text-decoration:none}
.ov-back-btn:hover{color:var(--ov-text);border-color:var(--ov-line-2);background:rgba(255,255,255,0.06);transform:translateY(-1px)}
.ov-brand{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-0.8px;background:linear-gradient(120deg,#FFFFFF 0%,#B8F3DA 55%,#3EE8A8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative}
.ov-brand::after{content:'';position:absolute;left:0;bottom:-4px;width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,#3EE8A8,transparent)}
.ov-balance-pill{font-size:11.5px;font-weight:700;color:var(--ov-accent);background:rgba(62,232,168,0.08);border:1px solid rgba(62,232,168,0.22);padding:8px 12px;border-radius:999px;white-space:nowrap}
.ov-balance-pill b{font-family:'Space Grotesk';letter-spacing:-0.3px;font-size:12.5px}
@keyframes ovSlideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.ov-hero{padding:4px 4px 18px;animation:ovFadeUp .7s cubic-bezier(.2,.9,.3,1.1) .05s both}
.ov-hero h1{font-family:'Space Grotesk';font-size:26px;font-weight:700;letter-spacing:-0.9px;margin:0 0 6px}
.ov-hero h1 .grad{background:linear-gradient(120deg,#3EE8A8,#7DF0C7 50%,#F4C97A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov-hero p{margin:0;font-size:12.5px;color:var(--ov-muted);font-weight:500}
@keyframes ovFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* SUMMARY STATS */
.ov-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;animation:ovFadeUp .75s cubic-bezier(.2,.9,.3,1.1) .08s both}
.ov-sum-card{position:relative;background:linear-gradient(160deg,rgba(20,27,46,0.75),rgba(15,21,36,0.95));border:1px solid var(--ov-line);border-radius:14px;padding:13px 14px;overflow:hidden}
.ov-sum-card::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent)}
.ov-sum-card.in{border-color:rgba(62,232,168,0.22)}
.ov-sum-card.in::before{background:linear-gradient(90deg,transparent,rgba(62,232,168,0.5),transparent)}
.ov-sum-card.out{border-color:rgba(255,107,122,0.22)}
.ov-sum-card.out::before{background:linear-gradient(90deg,transparent,rgba(255,107,122,0.5),transparent)}
.ov-sum-label{font-size:9.5px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--ov-muted-2);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.ov-sum-card.in .ov-sum-label i{color:var(--ov-accent)}
.ov-sum-card.out .ov-sum-label i{color:var(--ov-danger)}
.ov-sum-val{font-family:'Space Grotesk';font-size:18px;font-weight:700;letter-spacing:-0.5px}
.ov-sum-card.in .ov-sum-val{color:var(--ov-accent)}
.ov-sum-card.out .ov-sum-val{color:var(--ov-danger)}
.ov-net-row{margin-bottom:18px;animation:ovFadeUp .8s cubic-bezier(.2,.9,.3,1.1) .1s both}
.ov-net-card{position:relative;background:linear-gradient(160deg,rgba(91,141,239,0.10),rgba(15,21,36,0.9));border:1px solid rgba(91,141,239,0.22);border-radius:14px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:hidden}
.ov-net-card::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(91,141,239,0.5),transparent)}
.ov-net-label{font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--ov-muted)}
.ov-net-val{font-family:'Space Grotesk';font-size:17px;font-weight:700;letter-spacing:-0.4px}
.ov-net-val.pos{color:var(--ov-accent)}
.ov-net-val.neg{color:var(--ov-danger)}
.ov-net-val.neutral{color:var(--ov-muted)}

/* SEARCH */
.ov-search{position:relative;margin-bottom:12px;animation:ovFadeUp .85s cubic-bezier(.2,.9,.3,1.1) .12s both}
.ov-search input{width:100%;height:48px;padding:0 44px 0 46px;background:rgba(7,11,20,0.75);border:1.5px solid var(--ov-line);border-radius:13px;font-family:'Inter';font-size:13px;font-weight:500;color:var(--ov-text);outline:none;transition:all .25s}
.ov-search input::placeholder{color:var(--ov-muted-2)}
.ov-search input:focus{border-color:var(--ov-accent);background:rgba(7,11,20,0.95);box-shadow:0 0 0 4px rgba(62,232,168,0.10)}
.ov-search .ov-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ov-muted);font-size:1.1rem;pointer-events:none;transition:color .25s}
.ov-search input:focus ~ .ov-search-icon{color:var(--ov-accent)}
.ov-search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--ov-line);display:none;place-items:center;color:var(--ov-muted);font-size:0.95rem;cursor:pointer;transition:all .2s}
.ov-search-clear.show{display:grid}
.ov-search-clear:hover{color:var(--ov-danger);border-color:rgba(255,107,122,0.4);background:rgba(255,107,122,0.08)}

/* FILTER CHIPS */
.ov-filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;animation:ovFadeUp .9s cubic-bezier(.2,.9,.3,1.1) .14s both}
.ov-filters::-webkit-scrollbar{display:none}
.ov-chip{position:relative;flex-shrink:0;padding:9px 14px;border-radius:999px;background:rgba(20,27,46,0.6);border:1px solid var(--ov-line);color:var(--ov-muted);font-size:11.5px;font-weight:700;cursor:pointer;transition:all .22s;letter-spacing:0.3px;white-space:nowrap}
.ov-chip:hover{color:var(--ov-text);border-color:var(--ov-line-2)}
.ov-chip.active{background:rgba(62,232,168,0.1);border-color:rgba(62,232,168,0.35);color:var(--ov-accent)}
.ov-chip .count{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;background:rgba(255,255,255,0.06);padding:1px 6px;border-radius:8px;color:var(--ov-muted)}
.ov-chip.active .count{background:rgba(62,232,168,0.18);color:var(--ov-accent)}

/* DATE RANGE */
.ov-dates{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;animation:ovFadeUp .95s cubic-bezier(.2,.9,.3,1.1) .16s both}
.ov-dates::-webkit-scrollbar{display:none}
.ov-date-btn{flex-shrink:0;padding:7px 13px;border-radius:9px;background:rgba(20,27,46,0.5);border:1px solid var(--ov-line);color:var(--ov-muted);font-size:11px;font-weight:700;cursor:pointer;transition:all .22s;letter-spacing:0.3px}
.ov-date-btn:hover{color:var(--ov-text);border-color:var(--ov-line-2)}
.ov-date-btn.active{background:rgba(244,201,122,0.1);border-color:rgba(244,201,122,0.35);color:var(--ov-gold)}

/* TRANSACTION GROUPS */
.ov-group{margin-bottom:18px;animation:ovFadeUp .5s ease both}
.ov-group-head{display:flex;align-items:center;gap:10px;padding:0 4px 10px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ov-muted-2)}
.ov-group-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.08),transparent)}
.ov-group-count{font-family:'Space Grotesk';font-weight:700;color:var(--ov-muted);letter-spacing:0}

.ov-tx-list{background:linear-gradient(160deg,rgba(20,27,46,0.6),rgba(15,21,36,0.9));border:1px solid var(--ov-line);border-radius:14px;padding:4px;overflow:hidden}
.ov-tx-item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background .2s;position:relative}
.ov-tx-item:last-child{border-bottom:none}
.ov-tx-item:hover{background:rgba(255,255,255,0.025)}
.ov-tx-item:active{background:rgba(255,255,255,0.04)}
.ov-tx-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;flex-shrink:0}
.ov-tx-icon.dep{background:rgba(62,232,168,0.12);color:var(--ov-accent)}
.ov-tx-icon.wd{background:rgba(91,141,239,0.12);color:var(--ov-blue)}
.ov-tx-icon.roi{background:rgba(244,201,122,0.12);color:var(--ov-gold)}
.ov-tx-icon.spin{background:rgba(185,139,255,0.12);color:var(--ov-purple)}
.ov-tx-icon.inv{background:rgba(255,143,177,0.12);color:var(--ov-pink)}
.ov-tx-icon.ref{background:rgba(62,232,168,0.12);color:var(--ov-accent)}
.ov-tx-body{flex:1;min-width:0}
.ov-tx-title{font-size:12.5px;font-weight:700;color:var(--ov-text);margin:0 0 3px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-tx-sub{font-size:10.5px;color:var(--ov-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-tx-right{text-align:right;flex-shrink:0}
.ov-tx-amt{font-family:'Space Grotesk';font-size:13.5px;font-weight:700;white-space:nowrap;margin-bottom:3px}
.ov-tx-amt.pos{color:var(--ov-accent)}
.ov-tx-amt.neg{color:var(--ov-danger)}
.ov-tx-amt.neutral{color:var(--ov-muted)}
.ov-tx-status{font-size:9px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px;display:inline-block}
.ov-tx-status.success{background:rgba(62,232,168,0.12);color:var(--ov-accent)}
.ov-tx-status.pending{background:rgba(244,201,122,0.12);color:var(--ov-gold)}
.ov-tx-status.failed{background:rgba(255,107,122,0.12);color:var(--ov-danger)}
.ov-tx-status.rejected{background:rgba(255,107,122,0.12);color:var(--ov-danger)}

/* EMPTY */
.ov-empty{padding:40px 16px;text-align:center;color:var(--ov-muted);font-size:12.5px;font-weight:500;background:linear-gradient(160deg,rgba(20,27,46,0.4),rgba(15,21,36,0.7));border:1px dashed var(--ov-line-2);border-radius:16px}
.ov-empty i{font-size:2rem;display:block;margin-bottom:10px;color:var(--ov-muted-2)}
.ov-empty b{color:var(--ov-text);display:block;font-size:13.5px;margin-bottom:4px}

/* LOAD MORE */
.ov-load-more{width:100%;height:48px;margin:10px 0 8px;border-radius:13px;background:rgba(255,255,255,0.03);border:1px solid var(--ov-line-2);color:var(--ov-text);font-family:'Inter';font-size:12.5px;font-weight:700;letter-spacing:0.3px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px}
.ov-load-more:hover{background:rgba(62,232,168,0.08);border-color:rgba(62,232,168,0.3);color:var(--ov-accent)}
.ov-load-info{text-align:center;font-size:10.5px;color:var(--ov-muted-2);font-weight:600;padding:6px 0}

/* MODAL */
.ov-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,7,14,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ov-modal.open{display:flex;animation:ovModalFade .3s ease both}
@keyframes ovModalFade{from{opacity:0}to{opacity:1}}
.ov-modal-panel{position:relative;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,rgba(20,27,46,0.98),rgba(15,21,36,0.98));border:1px solid var(--ov-line-2);border-radius:22px;padding:24px 20px;box-shadow:0 30px 80px rgba(0,0,0,0.7);animation:ovModalPop .35s cubic-bezier(.68,-.55,.265,1.55) both}
.ov-modal-panel::-webkit-scrollbar{width:6px}
.ov-modal-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
@keyframes ovModalPop{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ov-modal-cancel{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--ov-line);display:grid;place-items:center;color:var(--ov-muted);font-size:1.05rem;cursor:pointer;transition:all .22s;z-index:2}
.ov-modal-cancel:hover{color:var(--ov-danger);border-color:rgba(255,107,122,0.4);background:rgba(255,107,122,0.08);transform:rotate(90deg)}

.ov-detail-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:6px 0 20px}
.ov-detail-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem}
.ov-detail-icon.dep{background:rgba(62,232,168,0.12);color:var(--ov-accent);border:1px solid rgba(62,232,168,0.3)}
.ov-detail-icon.wd{background:rgba(91,141,239,0.12);color:var(--ov-blue);border:1px solid rgba(91,141,239,0.3)}
.ov-detail-icon.roi{background:rgba(244,201,122,0.12);color:var(--ov-gold);border:1px solid rgba(244,201,122,0.3)}
.ov-detail-icon.spin{background:rgba(185,139,255,0.12);color:var(--ov-purple);border:1px solid rgba(185,139,255,0.3)}
.ov-detail-icon.inv{background:rgba(255,143,177,0.12);color:var(--ov-pink);border:1px solid rgba(255,143,177,0.3)}
.ov-detail-icon.ref{background:rgba(62,232,168,0.12);color:var(--ov-accent);border:1px solid rgba(62,232,168,0.3)}
.ov-detail-amt{font-family:'Space Grotesk';font-size:28px;font-weight:700;letter-spacing:-1px}
.ov-detail-amt.pos{color:var(--ov-accent)}
.ov-detail-amt.neg{color:var(--ov-danger)}
.ov-detail-amt.neutral{color:var(--ov-text)}
.ov-detail-status{font-size:10.5px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;padding:5px 11px;border-radius:8px}
.ov-detail-status.success{background:rgba(62,232,168,0.12);color:var(--ov-accent)}
.ov-detail-status.pending{background:rgba(244,201,122,0.12);color:var(--ov-gold)}
.ov-detail-status.failed,.ov-detail-status.rejected{background:rgba(255,107,122,0.12);color:var(--ov-danger)}

.ov-detail-rows{background:rgba(11,15,26,0.6);border:1px solid var(--ov-line);border-radius:13px;padding:4px 14px;margin-bottom:16px}
.ov-detail-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:12.5px;gap:12px}
.ov-detail-row + .ov-detail-row{border-top:1px dashed rgba(255,255,255,0.05)}
.ov-detail-row .k{color:var(--ov-muted);font-weight:600;flex-shrink:0}
.ov-detail-row .v{font-family:'Space Grotesk';font-weight:700;color:var(--ov-text);text-align:right;word-break:break-word;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.ov-copy-btn{background:rgba(62,232,168,0.08);border:1px solid rgba(62,232,168,0.25);color:var(--ov-accent);padding:4px 8px;border-radius:7px;font-size:10.5px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Inter';display:inline-flex;align-items:center;gap:4px}
.ov-copy-btn:hover{background:rgba(62,232,168,0.16);border-color:rgba(62,232,168,0.5)}
.ov-modal-btn{width:100%;height:50px;margin-top:6px;border:none;border-radius:13px;background:linear-gradient(135deg,#3EE8A8,#19B98B);color:#04261A;font-family:'Inter';font-size:13.5px;font-weight:800;letter-spacing:0.3px;cursor:pointer;transition:all .25s;box-shadow:0 12px 26px rgba(62,232,168,0.3);display:flex;align-items:center;justify-content:center;gap:7px}
.ov-modal-btn:hover{transform:translateY(-1px);box-shadow:0 16px 32px rgba(62,232,168,0.4)}

/* BOTTOM NAV */
.ov-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:55;background:linear-gradient(180deg,rgba(11,16,32,0.95),rgba(7,11,20,0.98));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ov-line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.ov-nav-row{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ov-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;cursor:pointer;transition:all .22s;text-decoration:none;color:var(--ov-muted)}
.ov-nav-item:hover{background:rgba(255,255,255,0.03)}
.ov-nav-item.active{color:var(--ov-accent);background:rgba(62,232,168,0.08)}
.ov-nav-item i{font-size:1.35rem}
.ov-nav-item span{font-size:9.5px;font-weight:700;letter-spacing:0.3px}

/* TOASTS */
#ov-toast-container{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.ov-toast{background:linear-gradient(180deg,rgba(20,27,46,0.98),rgba(15,21,36,0.98));border:1px solid var(--ov-line-2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,0.6);display:flex;align-items:flex-start;padding:13px 14px;pointer-events:auto;transform:translateY(-28px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.68,-.55,.265,1.55);backdrop-filter:blur(14px)}
.ov-toast.show{transform:translateY(0) scale(1);opacity:1}
.ov-toast-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px;margin-right:11px;flex-shrink:0}
.ov-toast-body{flex:1;min-width:0}
.ov-toast-title{font-size:12.5px;font-weight:800;color:var(--ov-text);margin-bottom:3px}
.ov-toast-msg{font-size:11.5px;color:var(--ov-muted);line-height:1.5}
.ov-toast-close{background:none;border:none;color:var(--ov-muted-2);font-size:13px;cursor:pointer;padding:3px;border-radius:6px}
.ov-toast-close:hover{color:var(--ov-text)}

/* LOADER */
.ov-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(7,11,20,0.96);backdrop-filter:blur(8px);transition:opacity .4s}
.ov-loader.hide{opacity:0;pointer-events:none}
.ov-loader .ring{width:44px;height:44px;border:3px solid rgba(62,232,168,0.15);border-top-color:var(--ov-accent);border-radius:50%;animation:ovSpin .8s linear infinite}
@keyframes ovSpin{to{transform:rotate(360deg)}}

@media(max-width:380px){
  .ov-shell{padding:0 13px}
  .ov-hero h1{font-size:22px}
  .ov-sum-val{font-size:16px}
  .ov-net-val{font-size:15px}
  .ov-detail-amt{font-size:24px}
}
</style>
</head>
<body>

<div class="ov-bg-layer">
  <div class="ov-grid"></div>
  <div class="ov-orb ov-orb-a"></div>
  <div class="ov-orb ov-orb-b"></div>
  <div class="ov-vignette"></div>
</div>

<main class="ov-shell">

  <!-- TOP BAR -->
  <div class="ov-topbar">
    <div class="ov-top-left">
      <a href="dashboard.html" class="ov-back-btn"><i class="ph ph-arrow-left"></i></a>
      <div class="ov-brand">Ovexa</div>
    </div>
    <div class="ov-balance-pill">Deposit: <b id="ovDepBal">₦0</b></div>
  </div>

  <!-- HERO -->
  <div class="ov-hero">
    <h1>Transaction <span class="grad">History</span></h1>
    <p>All your deposits, withdrawals, earnings, and bonuses</p>
  </div>

  <!-- SUMMARY STATS -->
  <div class="ov-summary">
    <div class="ov-sum-card in">
      <div class="ov-sum-label"><i class="ph ph-arrow-down-left"></i> Total In</div>
      <div class="ov-sum-val" id="ovTotalIn">₦0</div>
    </div>
    <div class="ov-sum-card out">
      <div class="ov-sum-label"><i class="ph ph-arrow-up-right"></i> Total Out</div>
      <div class="ov-sum-val" id="ovTotalOut">₦0</div>
    </div>
  </div>

  <div class="ov-net-row">
    <div class="ov-net-card">
      <span class="ov-net-label">Net Balance Change</span>
      <span class="ov-net-val neutral" id="ovNetChange">₦0</span>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="ov-search">
    <input type="text" id="ovSearchInput" placeholder="Search by type, note, or amount...">
    <i class="ph ph-magnifying-glass ov-search-icon"></i>
    <button class="ov-search-clear" id="ovSearchClear" onclick="clearSearch()"><i class="ph ph-x"></i></button>
  </div>

  <!-- FILTER CHIPS -->
  <div class="ov-filters" id="ovFilters">
    <button class="ov-chip active" data-filter="all">All <span class="count" id="cntAll">0</span></button>
    <button class="ov-chip" data-filter="Deposit">Deposits <span class="count" id="cntDeposit">0</span></button>
    <button class="ov-chip" data-filter="Withdrawal">Withdrawals <span class="count" id="cntWithdrawal">0</span></button>
    <button class="ov-chip" data-filter="Investment">Investments <span class="count" id="cntInvestment">0</span></button>
    <button class="ov-chip" data-filter="ROI">ROI <span class="count" id="cntROI">0</span></button>
    <button class="ov-chip" data-filter="Referral Bonus">Referrals <span class="count" id="cntReferral">0</span></button>
    <button class="ov-chip" data-filter="Spin Bonus">Spin <span class="count" id="cntSpin">0</span></button>
  </div>

  <!-- DATE RANGE -->
  <div class="ov-dates">
    <button class="ov-date-btn" data-range="today">Today</button>
    <button class="ov-date-btn" data-range="7">Last 7 Days</button>
    <button class="ov-date-btn" data-range="30">Last 30 Days</button>
    <button class="ov-date-btn active" data-range="all">All Time</button>
  </div>

  <!-- LIST WRAP -->
  <div id="ovListWrap">
    <div class="ov-empty"><i class="ph ph-folder-open"></i><b>Loading…</b>Fetching your transactions</div>
  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="ov-bottom-nav">
  <div class="ov-nav-row">
    <a class="ov-nav-item" href="dashboard.html"><i class="ph ph-house"></i><span>Home</span></a>
    <a class="ov-nav-item" href="invest.html"><i class="ph ph-chart-line-up"></i><span>Invest</span></a>
    <a class="ov-nav-item active" href="transactions.html"><i class="ph ph-receipt"></i><span>History</span></a>
    <a class="ov-nav-item" href="profile.html"><i class="ph ph-user"></i><span>Profile</span></a>
  </div>
</nav>

<!-- DETAIL MODAL -->
<div class="ov-modal" id="ovDetailModal">
  <div class="ov-modal-panel">
    <button class="ov-modal-cancel" onclick="closeModal('ovDetailModal')"><i class="ph ph-x"></i></button>
    <div class="ov-detail-head">
      <div class="ov-detail-icon" id="ovDetailIcon"><i class="ph ph-receipt"></i></div>
      <div class="ov-detail-amt" id="ovDetailAmt">₦0</div>
      <div class="ov-detail-status success" id="ovDetailStatus">Success</div>
    </div>
    <div class="ov-detail-rows" id="ovDetailRows"></div>
    <button class="ov-modal-btn" onclick="closeModal('ovDetailModal')"><i class="ph ph-check"></i> Close</button>
  </div>
</div>

<div id="ov-toast-container"></div>
<div class="ov-loader" id="ovLoader"><div class="ring"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqXdfRRQZbbrB4DIpTAj45FkxJsXm3JrM",
  authDomain: "vexa-c0868.firebaseapp.com",
  projectId: "vexa-c0868",
  storageBucket: "vexa-c0868.firebasestorage.app",
  messagingSenderId: "209201666488",
  appId: "1:209201666488:web:ae6d16fec94097e719174d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// State
window._state = {
  user:null,
  username:null,
  userDoc:null,
  transactions:[],
  filtered:[],
  activeFilter:'all',
  activeRange:'all',
  searchQuery:'',
  page:1,
  perPage:20
};

// Currency format
function fmt(n){
  n = Number(n)||0;
  return '₦' + n.toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2});
}

// ---------- AUTH GUARD ----------
onAuthStateChanged(auth, async (user)=>{
  if(!user){ window.location.href = 'login.html'; return; }
  window._state.user = user;
  await bootstrap();
});

async function bootstrap(){
  try{
    let username = sessionStorage.getItem('username');
    if(!username){
      const mapSnap = await getDoc(doc(db,'usersByUid', window._state.user.uid));
      if(mapSnap.exists()) username = mapSnap.data().username;
    }
    if(!username){
      username = (sessionStorage.getItem('userEmail') || '').split('@')[0].toUpperCase();
    }
    window._state.username = username;

    // User doc for balance pill
    const userSnap = await getDoc(doc(db,'users',username));
    if(userSnap.exists()){
      window._state.userDoc = userSnap.data();
      document.getElementById('ovDepBal').textContent = fmt(window._state.userDoc.depositWallet || 0);
    }

    // Load transactions
    const txSnap = await getDoc(doc(db,'transactionHistory',username));
    const list = txSnap.exists() && Array.isArray(txSnap.data().transactions) ? txSnap.data().transactions : [];

    // Sort newest first
    list.sort((a,b) => {
      const ta = new Date(a.timestamp || 0).getTime();
      const tb = new Date(b.timestamp || 0).getTime();
      return tb - ta;
    });

    window._state.transactions = list;
    computeSummary();
    computeCounts();
    applyFilters();

    document.getElementById('ovLoader').classList.add('hide');
  }catch(err){
    console.error('Bootstrap error:', err);
    document.getElementById('ovLoader').classList.add('hide');
    document.getElementById('ovListWrap').innerHTML = `
      <div class="ov-empty"><i class="ph ph-warning-circle"></i><b>Failed to load</b>Please refresh the page</div>
    `;
  }
}

// ---------- SUMMARY STATS ----------
function computeSummary(){
  const list = window._state.transactions;
  let totalIn = 0, totalOut = 0;
  list.forEach(tx => {
    const amt = Number(tx.amount) || 0;
    if(isDebit(tx.type)) totalOut += amt;
    else totalIn += amt;
  });
  document.getElementById('ovTotalIn').textContent = fmt(totalIn);
  document.getElementById('ovTotalOut').textContent = fmt(totalOut);

  const net = totalIn - totalOut;
  const el = document.getElementById('ovNetChange');
  el.textContent = (net >= 0 ? '+' : '') + fmt(net);
  el.className = 'ov-net-val ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : 'neutral');
}

function isDebit(type){
  const t = (type||'').toLowerCase();
  return t.includes('withdraw') || t.includes('investment');
}

// ---------- COUNTS PER FILTER ----------
function computeCounts(){
  const list = window._state.transactions;
  const get = (match) => list.filter(t => (t.type||'').toLowerCase().includes(match)).length;
  document.getElementById('cntAll').textContent = list.length;
  document.getElementById('cntDeposit').textContent = get('deposit');
  document.getElementById('cntWithdrawal').textContent = get('withdraw');
  document.getElementById('cntInvestment').textContent = get('investment');
  document.getElementById('cntROI').textContent = list.filter(t => (t.type||'').toLowerCase().includes('roi') || (t.type||'').toLowerCase().includes('earning')).length;
  document.getElementById('cntReferral').textContent = list.filter(t => (t.type||'').toLowerCase().includes('referral')).length;
  document.getElementById('cntSpin').textContent = list.filter(t => (t.type||'').toLowerCase().includes('spin')).length;
}

// ---------- APPLY FILTERS ----------
function applyFilters(){
  const list = window._state.transactions;
  const {activeFilter, activeRange, searchQuery} = window._state;

  let filtered = list.filter(tx => {
    // Filter chip
    if(activeFilter !== 'all'){
      const type = (tx.type||'').toLowerCase();
      const f = activeFilter.toLowerCase();
      if(f === 'roi'){
        if(!type.includes('roi') && !type.includes('earning')) return false;
      } else if(f === 'referral bonus'){
        if(!type.includes('referral')) return false;
      } else {
        if(!type.includes(f)) return false;
      }
    }
    // Date range
    if(activeRange !== 'all'){
      const t = new Date(tx.timestamp || 0).getTime();
      const now = Date.now();
      if(activeRange === 'today'){
        const start = new Date(); start.setHours(0,0,0,0);
        if(t < start.getTime()) return false;
      } else {
        const days = Number(activeRange);
        if(t < now - days * 86400000) return false;
      }
    }
    // Search
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      const hay = ((tx.type||'') + ' ' + (tx.note||'') + ' ' + (tx.reference||'') + ' ' + (tx.amount||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  window._state.filtered = filtered;
  window._state.page = 1;
  renderList();
}

// ---------- RENDER LIST ----------
function groupByDate(list){
  const groups = { today:[], yesterday:[], week:[], earlier:[] };
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const startYesterday = startToday - 86400000;
  const startWeek = startToday - 6 * 86400000;
  list.forEach(tx => {
    const t = new Date(tx.timestamp || 0).getTime();
    if(t >= startToday) groups.today.push(tx);
    else if(t >= startYesterday) groups.yesterday.push(tx);
    else if(t >= startWeek) groups.week.push(tx);
    else groups.earlier.push(tx);
  });
  return groups;
}

function iconFor(type){
  const t = (type||'').toLowerCase();
  if(t.includes('deposit')) return { cls:'dep', icon:'ph-arrow-down-left' };
  if(t.includes('withdraw')) return { cls:'wd', icon:'ph-arrow-up-right' };
  if(t.includes('roi') || t.includes('earning')) return { cls:'roi', icon:'ph-trend-up' };
  if(t.includes('spin')) return { cls:'spin', icon:'ph-gift' };
  if(t.includes('invest')) return { cls:'inv', icon:'ph-chart-line-up' };
  if(t.includes('referral')) return { cls:'ref', icon:'ph-users-three' };
  return { cls:'dep', icon:'ph-receipt' };
}

function timeAgo(iso){
  if(!iso) return 'just now';
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  if(s < 604800) return Math.floor(s/86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function fullDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-NG',{year:'numeric',month:'short',day:'numeric'}) + ' • ' + d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});
}

function renderList(){
  const wrap = document.getElementById('ovListWrap');
  const filtered = window._state.filtered;

  if(filtered.length === 0){
    wrap.innerHTML = `
      <div class="ov-empty">
        <i class="ph ph-folder-open"></i>
        <b>No transactions found</b>
        ${window._state.searchQuery ? 'Try a different search' : 'Your history will appear here'}
      </div>
    `;
    return;
  }

  // Apply pagination
  const visible = filtered.slice(0, window._state.page * window._state.perPage);
  const groups = groupByDate(visible);

  const groupMeta = [
    { key:'today', label:'Today' },
    { key:'yesterday', label:'Yesterday' },
    { key:'week', label:'This Week' },
    { key:'earlier', label:'Earlier' }
  ];

  let html = '';
  groupMeta.forEach(g => {
    const arr = groups[g.key];
    if(!arr || arr.length === 0) return;
    html += `
      <div class="ov-group">
        <div class="ov-group-head">
          <span>${g.label}</span>
          <span class="ov-group-count">${arr.length}</span>
        </div>
        <div class="ov-tx-list">
          ${arr.map(tx => renderTxItem(tx)).join('')}
        </div>
      </div>
    `;
  });

  if(visible.length < filtered.length){
    html += `
      <button class="ov-load-more" onclick="loadMore()">
        <i class="ph ph-arrow-down"></i> Load More (${filtered.length - visible.length} remaining)
      </button>
      <div class="ov-load-info">Showing ${visible.length} of ${filtered.length}</div>
    `;
  } else {
    html += `<div class="ov-load-info">Showing all ${filtered.length} transaction${filtered.length===1?'':'s'}</div>`;
  }

  wrap.innerHTML = html;
}

function renderTxItem(tx){
  const { cls, icon } = iconFor(tx.type);
  const amt = Number(tx.amount) || 0;
  const debit = isDebit(tx.type);
  const status = (tx.status||'Success').toLowerCase();
  const statusClass = status.includes('pending') ? 'pending' : (status.includes('fail') || status.includes('reject')) ? 'failed' : 'success';
  const idx = window._state.transactions.indexOf(tx);
  const sub = tx.note ? tx.note : timeAgo(tx.timestamp);

  return `
    <div class="ov-tx-item" onclick="openDetail(${idx})">
      <div class="ov-tx-icon ${cls}"><i class="ph ${icon}"></i></div>
      <div class="ov-tx-body">
        <div class="ov-tx-title">${tx.type || 'Transaction'}</div>
        <div class="ov-tx-sub">${sub}</div>
      </div>
      <div class="ov-tx-right">
        <div class="ov-tx-amt ${debit ? 'neg' : (amt > 0 ? 'pos' : 'neutral')}">${debit ? '-' : (amt > 0 ? '+' : '')}${fmt(amt)}</div>
        <div class="ov-tx-status ${statusClass}">${tx.status || 'Success'}</div>
      </div>
    </div>
  `;
}

function loadMore(){
  window._state.page++;
  renderList();
}
window.loadMore = loadMore;

// ---------- DETAIL MODAL ----------
function openDetail(idx){
  const tx = window._state.transactions[idx];
  if(!tx) return;

  const { cls, icon } = iconFor(tx.type);
  const amt = Number(tx.amount) || 0;
  const debit = isDebit(tx.type);
  const status = (tx.status||'Success').toLowerCase();
  const statusClass = status.includes('pending') ? 'pending' : (status.includes('fail') || status.includes('reject')) ? 'failed' : 'success';

  document.getElementById('ovDetailIcon').className = 'ov-detail-icon ' + cls;
  document.getElementById('ovDetailIcon').innerHTML = `<i class="ph ${icon}"></i>`;

  const amtEl = document.getElementById('ovDetailAmt');
  amtEl.textContent = (debit ? '-' : (amt > 0 ? '+' : '')) + fmt(amt);
  amtEl.className = 'ov-detail-amt ' + (debit ? 'neg' : (amt > 0 ? 'pos' : 'neutral'));

  const statusEl = document.getElementById('ovDetailStatus');
  statusEl.textContent = tx.status || 'Success';
  statusEl.className = 'ov-detail-status ' + statusClass;

  const txId = tx.id || ('tx_' + (new Date(tx.timestamp||0).getTime()));
  const ref = tx.reference || '—';

  const rows = [
    { k:'Type', v: tx.type || '—' },
    { k:'Amount', v: fmt(amt) },
    { k:'Status', v: tx.status || 'Success' },
    { k:'Date', v: fullDate(tx.timestamp) },
    tx.note ? { k:'Note', v: tx.note } : null,
    { k:'Reference', v: ref, copy: ref !== '—' },
    { k:'Transaction ID', v: txId, copy: true }
  ].filter(Boolean);

  document.getElementById('ovDetailRows').innerHTML = rows.map(r => `
    <div class="ov-detail-row">
      <span class="k">${r.k}</span>
      <span class="v">${r.v}${r.copy ? ` <button class="ov-copy-btn" onclick="copyText('${String(r.v).replace(/'/g,"\\'")}')"><i class="ph ph-copy"></i></button>` : ''}</span>
    </div>
  `).join('');

  openModal('ovDetailModal');
}
window.openDetail = openDetail;

function copyText(text){
  try{
    navigator.clipboard.writeText(text);
    ovNotify('success','Copied to clipboard');
  }catch(e){
    ovNotify('warning','Copy failed');
  }
}
window.copyText = copyText;

// ---------- FILTER EVENTS ----------
document.getElementById('ovFilters').addEventListener('click', e => {
  const btn = e.target.closest('.ov-chip');
  if(!btn) return;
  document.querySelectorAll('.ov-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  window._state.activeFilter = btn.dataset.filter;
  applyFilters();
});

document.querySelectorAll('.ov-date-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ov-date-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window._state.activeRange = btn.dataset.range;
    applyFilters();
  });
});

// ---------- SEARCH ----------
const searchInput = document.getElementById('ovSearchInput');
const searchClear = document.getElementById('ovSearchClear');
searchInput.addEventListener('input', () => {
  window._state.searchQuery = searchInput.value.trim();
  searchClear.classList.toggle('show', window._state.searchQuery.length > 0);
  applyFilters();
});
function clearSearch(){
  searchInput.value = '';
  window._state.searchQuery = '';
  searchClear.classList.remove('show');
  applyFilters();
}
window.clearSearch = clearSearch;

// ---------- MODAL HELPERS ----------
function openModal(id){ document.getElementById(id)?.classList.add('open'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('open'); }
window.openModal = openModal;
window.closeModal = closeModal;

// ---------- TOASTS ----------
function ovNotify(type, message){
  let container = document.getElementById('ov-toast-container');
  if(!container){ container = document.createElement('div'); container.id = 'ov-toast-container'; document.body.appendChild(container); }
  const themes = {
    success:{ icon:'fa-solid fa-check-double', color:'#3EE8A8', bg:'rgba(62,232,168,0.12)', title:'Success' },
    error:{ icon:'fa-solid fa-circle-exclamation', color:'#FF6B7A', bg:'rgba(255,107,122,0.12)', title:'Error' },
    warning:{ icon:'fa-solid fa-triangle-exclamation', color:'#F4C97A', bg:'rgba(244,201,122,0.12)', title:'Notice' },
    info:{ icon:'fa-solid fa-bell', color:'#5B8DEF', bg:'rgba(91,141,239,0.12)', title:'Info' }
  };
  const th = themes[type] || themes.info;
  const toast = document.createElement('div');
  toast.className = 'ov-toast';
  toast.style.borderLeft = `3px solid ${th.color}`;
  toast.innerHTML = `
    <div class="ov-toast-icon" style="color:${th.color};background:${th.bg}"><i class="${th.icon}"></i></div>
    <div class="ov-toast-body">
      <div class="ov-toast-title">${th.title}</div>
      <div class="ov-toast-msg">${message}</div>
    </div>
    <button class="ov-toast-close" onclick="this.closest('.ov-toast').remove()"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(toast);
  setTimeout(()=>toast.classList.add('show'), 10);
  setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(), 350); }, 4500);
}
window.ovNotify = ovNotify;

console.log('✅ Ovexa transactions page ready');
</script>
</body>
</html>
