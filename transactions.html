<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Ovexa — History</title>

<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<meta name="theme-color" content="#07090D">

<style>
:root{
  --bg:#07090D;
  --s1:#0D1117;
  --s2:#131922;
  --s3:#1A2230;
  --ln:rgba(255,255,255,0.07);
  --ln2:rgba(255,255,255,0.13);
  --tx:#ECF1F8;
  --tx2:#8791A5;
  --tx3:#555F73;
  --mint:#3EE8A8;
  --gold:#F4C97A;
  --rose:#FF6B7A;
  --sky:#5B8DEF;
  --violet:#B98BFF;
  --pink:#FF8FB1;
}
html,body{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--bg);color:var(--tx)}
*,*::before,*::after{box-sizing:inherit}
body{min-height:100vh;position:relative;overflow-x:hidden;padding-bottom:104px;background-image:radial-gradient(rgba(255,255,255,0.045) 1px,transparent 1px);background-size:22px 22px}
.num{font-family:'Space Grotesk';font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:540px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* ============ HEADER ============ */
.top{position:sticky;top:0;z-index:60;margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:rgba(7,9,13,0.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px}
.back{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;color:var(--tx2);font-size:1.1rem;text-decoration:none;flex-shrink:0}
.back:hover{color:var(--tx);border-color:var(--ln2)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-family:'Space Grotesk';font-size:17px;font-weight:700;letter-spacing:-0.02em}
.ttl small{display:block;font-size:11px;color:var(--tx2);margin-top:1px}
.wallet{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(62,232,168,0.08);border:1px solid rgba(62,232,168,0.22);font-size:12px;font-weight:700;color:var(--mint);white-space:nowrap}
.wallet i{font-size:1rem}

/* ============ IN / OUT STRIP ============ */
.flow{margin-top:14px;border:1px solid var(--ln2);border-radius:18px;background:var(--s1);overflow:hidden;animation:rise .5s ease both}
.flow-r{display:grid;grid-template-columns:1fr 1px 1fr}
.flow-r > div{padding:14px 16px}
.flow-r .sep{padding:0;background:var(--ln)}
.fl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.fl i{font-size:.95rem}
.fl.in i{color:var(--mint)}
.fl.out i{color:var(--rose)}
.fv{margin-top:7px;font-size:20px;font-weight:700}
.fv.in{color:var(--mint)}
.fv.out{color:var(--rose)}
.flow-bar{display:flex;height:4px;background:rgba(255,255,255,0.05)}
.flow-bar i{display:block;height:100%;transition:width .8s ease}
.flow-bar .a{background:var(--mint)}
.flow-bar .b{background:var(--rose)}

/* ============ TOOLBAR ============ */
.tools{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.seg{position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border:1px solid var(--ln);border-radius:13px;background:var(--s1)}
.seg button{position:relative;z-index:2;height:34px;border:none;background:none;color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;transition:color .25s}
.seg button.on{color:#04261A}
.seg-i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--mint);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);z-index:1}
.ib{position:relative;width:44px;height:44px;border-radius:13px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;color:var(--tx2);font-size:1.15rem;cursor:pointer;flex-shrink:0;transition:.2s}
.ib:hover,.ib.on{color:var(--mint);border-color:rgba(62,232,168,0.4)}
.ib .bdg{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--mint);color:#04261A;font-size:9px;font-weight:800;display:none;place-items:center;border:2px solid var(--bg)}
.ib .bdg.show{display:grid}
.search{display:none;position:relative;margin-bottom:10px}
.search.open{display:block;animation:rise .25s ease both}
.search input{width:100%;height:46px;padding:0 42px 0 42px;background:var(--s1);border:1.5px solid var(--ln);border-radius:13px;font-family:'Inter';font-size:13px;font-weight:500;color:var(--tx);outline:none;transition:.25s}
.search input::placeholder{color:var(--tx3)}
.search input:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(62,232,168,0.1)}
.search > i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx2);font-size:1.05rem;pointer-events:none}
.search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;border:none;background:var(--s3);color:var(--tx2);display:none;place-items:center;cursor:pointer;font-size:.9rem}
.search .clr.show{display:grid}

/* active filters */
.act{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.act:empty{display:none}
.af{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;border-radius:999px;background:rgba(62,232,168,0.1);border:1px solid rgba(62,232,168,0.3);color:var(--mint);font-size:11px;font-weight:700;cursor:pointer}
.af i{font-size:.85rem;opacity:.8}

/* ============ LEDGER ============ */
.day{margin-top:16px;animation:rise .4s ease both}
.day-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.day-h span:last-child{letter-spacing:0;font-family:'Space Grotesk';color:var(--tx2)}
.led{border:1px solid var(--ln);border-radius:16px;background:var(--s1);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 13px;cursor:pointer;transition:background .15s;border-top:1px solid var(--ln)}
.row:first-child{border-top:none}
.row:hover,.row:active{background:rgba(255,255,255,0.03)}
.ri{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;flex-shrink:0}
.ri.dep{background:rgba(62,232,168,0.12);color:var(--mint)}
.ri.wd{background:rgba(91,141,239,0.12);color:var(--sky)}
.ri.roi{background:rgba(244,201,122,0.12);color:var(--gold)}
.ri.spin{background:rgba(185,139,255,0.12);color:var(--violet)}
.ri.inv{background:rgba(255,143,177,0.12);color:var(--pink)}
.ri.ref{background:rgba(62,232,168,0.12);color:var(--mint)}
.rb{flex:1;min-width:0}
.rb b{display:block;font-size:12.5px;font-weight:700;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb small{display:block;margin-top:3px;font-size:10.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{text-align:right;flex-shrink:0}
.ra .am{font-size:13.5px;font-weight:700;white-space:nowrap}
.ra .am.pos{color:var(--mint)}
.ra .am.neg{color:var(--rose)}
.ra .am.zero{color:var(--tx2)}
.stt{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.stt::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.stt.success{color:var(--mint)}
.stt.pending{color:var(--gold)}
.stt.failed{color:var(--rose)}

.more{width:100%;height:46px;margin:14px 0 6px;border-radius:13px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.more:hover{border-color:rgba(62,232,168,0.4);color:var(--mint)}
.foot{text-align:center;font-size:10.5px;color:var(--tx3);font-weight:600;padding:8px 0}
.empty{margin-top:16px;border:1px dashed var(--ln2);border-radius:18px;padding:34px 16px;text-align:center;color:var(--tx2);font-size:12px}
.empty i{display:block;font-size:1.9rem;color:var(--tx3);margin-bottom:8px}
.empty b{display:block;color:var(--tx);font-size:13px;margin-bottom:3px}
.empty button{margin-top:12px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--ln2);background:transparent;color:var(--mint);font-size:12px;font-weight:700;cursor:pointer}

/* ============ DOCK ============ */
.dock-w{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:0 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.dock{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:60px;background:rgba(13,17,23,0.95);border:1px solid var(--ln2);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,0.55)}
.dk{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);text-decoration:none;font-size:9.5px;font-weight:700;padding:6px 0}
.dk i{font-size:1.25rem}
.dk.on,.dk:hover{color:var(--mint)}

/* ============ SHEETS ============ */
.ov-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center;background:rgba(3,5,8,0.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov-modal.open{display:flex;animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{position:relative;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--s1);border:1px solid var(--ln2);border-bottom:none;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.9,.3,1) both}
.sheet::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--ln2);margin:0 auto 16px}
.sh-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-t h3{margin:0;font-family:'Space Grotesk';font-size:17px;font-weight:700}
.sh-t button{background:none;border:none;color:var(--mint);font-size:12px;font-weight:700;cursor:pointer}
.grp{margin-bottom:16px}
.grp .lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:9px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.op{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--ln);background:var(--s2);color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.op small{font-size:10px;font-weight:800;padding:1px 6px;border-radius:7px;background:rgba(255,255,255,0.07)}
.op.on{background:rgba(62,232,168,0.1);border-color:rgba(62,232,168,0.4);color:var(--mint)}
.op.on small{background:rgba(62,232,168,0.2)}
.op.gold.on{background:rgba(244,201,122,0.1);border-color:rgba(244,201,122,0.4);color:var(--gold)}
.btn{width:100%;height:48px;border:none;border-radius:13px;background:var(--mint);color:#04261A;font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}

/* receipt */
.rc{text-align:center;padding:4px 0 16px}
.rc-i{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:1.6rem;margin:0 auto 12px}
.rc-i.dep{background:rgba(62,232,168,0.12);color:var(--mint);border:1px solid rgba(62,232,168,0.3)}
.rc-i.wd{background:rgba(91,141,239,0.12);color:var(--sky);border:1px solid rgba(91,141,239,0.3)}
.rc-i.roi{background:rgba(244,201,122,0.12);color:var(--gold);border:1px solid rgba(244,201,122,0.3)}
.rc-i.spin{background:rgba(185,139,255,0.12);color:var(--violet);border:1px solid rgba(185,139,255,0.3)}
.rc-i.inv{background:rgba(255,143,177,0.12);color:var(--pink);border:1px solid rgba(255,143,177,0.3)}
.rc-i.ref{background:rgba(62,232,168,0.12);color:var(--mint);border:1px solid rgba(62,232,168,0.3)}
.rc-a{font-size:30px;font-weight:700;letter-spacing:-0.04em}
.rc-a.pos{color:var(--mint)}
.rc-a.neg{color:var(--rose)}
.rc-s{display:inline-block;margin-top:9px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:8px}
.rc-s.success{background:rgba(62,232,168,0.12);color:var(--mint)}
.rc-s.pending{background:rgba(244,201,122,0.12);color:var(--gold)}
.rc-s.failed{background:rgba(255,107,122,0.12);color:var(--rose)}
.rows{position:relative;border:1px solid var(--ln);border-radius:14px;background:var(--s2);padding:4px 14px;margin-bottom:12px}
.rr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:12.5px}
.rr + .rr{border-top:1px dashed var(--ln2)}
.rr .k{color:var(--tx2);font-weight:600;flex-shrink:0}
.rr .v{font-family:'Space Grotesk';font-weight:700;text-align:right;word-break:break-word;display:flex;align-items:center;gap:7px;justify-content:flex-end}
.cp{width:26px;height:26px;border-radius:8px;border:1px solid rgba(62,232,168,0.28);background:rgba(62,232,168,0.08);color:var(--mint);display:grid;place-items:center;cursor:pointer;font-size:.85rem;flex-shrink:0}

/* ============ TOAST (compact, top-right) ============ */
#ov-toast-container{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:99999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:min(300px,calc(100vw - 24px))}
.ov-toast{position:relative;display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:11px;background:rgba(19,25,34,0.95);border:1px solid var(--ln2);box-shadow:0 10px 28px rgba(0,0,0,0.5);backdrop-filter:blur(12px);pointer-events:auto;cursor:pointer;overflow:hidden;transform:translateX(26px);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s}
.ov-toast.show{transform:none;opacity:1}
.ov-toast > i{font-size:16px;color:var(--c);flex-shrink:0}
.ov-toast .m{font-size:11.5px;font-weight:600;line-height:1.4}
.ov-toast .tb{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--c);opacity:.75;transform-origin:left;animation:tb 4.2s linear forwards}
@keyframes tb{to{transform:scaleX(0)}}

.ov-loader{position:fixed;inset:0;z-index:99998;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.ov-loader.hide{opacity:0;pointer-events:none}
.ov-loader .rg{width:42px;height:42px;border:3px solid rgba(62,232,168,0.15);border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:380px){
  .fv{font-size:18px}
  .rc-a{font-size:26px}
}
</style>
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <header class="top">
    <a href="dashboard.html" class="back" aria-label="Back"><i class="ph ph-arrow-left"></i></a>
    <div class="ttl"><b>History</b><small id="ovSub">Your transactions</small></div>
    <div class="wallet"><i class="ph ph-wallet"></i><span class="num" id="ovDepBal">₦0</span></div>
  </header>

  <!-- IN / OUT -->
  <section class="flow">
    <div class="flow-r">
      <div><div class="fl in"><i class="ph ph-arrow-down-left"></i> Money in</div><div class="fv in num" id="ovIn">₦0</div></div>
      <div class="sep"></div>
      <div><div class="fl out"><i class="ph ph-arrow-up-right"></i> Money out</div><div class="fv out num" id="ovOut">₦0</div></div>
    </div>
    <div class="flow-bar"><i class="a" id="ovBarA" style="width:0"></i><i class="b" id="ovBarB" style="width:0"></i></div>
  </section>

  <!-- TOOLBAR -->
  <div class="tools">
    <div class="seg">
      <span class="seg-i" id="ovSegI"></span>
      <button class="on" data-dir="all">All</button>
      <button data-dir="in">In</button>
      <button data-dir="out">Out</button>
    </div>
    <button class="ib" id="ovSearchBtn" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button>
    <button class="ib" id="ovFilterBtn" aria-label="Filters"><i class="ph ph-sliders-horizontal"></i><span class="bdg" id="ovFilterBdg">0</span></button>
  </div>

  <div class="search" id="ovSearch">
    <i class="ph ph-magnifying-glass"></i>
    <input type="text" id="ovSearchInput" placeholder="Search type, note or amount" autocomplete="off">
    <button class="clr" id="ovSearchClr" aria-label="Clear"><i class="ph ph-x"></i></button>
  </div>

  <div class="act" id="ovActive"></div>

  <!-- LEDGER -->
  <div id="ovList"></div>

</div>

<!-- DOCK -->
<div class="dock-w">
  <nav class="dock">
    <a class="dk" href="dashboard.html"><i class="ph ph-squares-four"></i><span>Home</span></a>
    <a class="dk" href="invest.html"><i class="ph ph-chart-line-up"></i><span>Invest</span></a>
    <a class="dk on" href="transactions.html"><i class="ph ph-receipt"></i><span>History</span></a>
    <a class="dk" href="referral.html"><i class="ph ph-users-three"></i><span>Referral</span></a>
    <a class="dk" href="profile.html"><i class="ph ph-user"></i><span>Profile</span></a>
  </nav>
</div>

<!-- FILTER SHEET -->
<div class="ov-modal" id="ovFilterModal">
  <div class="sheet">
    <div class="sh-t"><h3>Filters</h3><button onclick="resetFilters()">Reset</button></div>
    <div class="grp"><span class="lbl">Type</span><div class="opts" id="ovTypeOpts"></div></div>
    <div class="grp"><span class="lbl">Period</span>
      <div class="opts" id="ovRangeOpts">
        <button class="op gold on" data-range="all">All time</button>
        <button class="op gold" data-range="today">Today</button>
        <button class="op gold" data-range="7">7 days</button>
        <button class="op gold" data-range="30">30 days</button>
      </div>
    </div>
    <button class="btn" onclick="closeModal('ovFilterModal')"><i class="ph ph-check"></i> <span id="ovApplyTxt">Show results</span></button>
  </div>
</div>

<!-- RECEIPT SHEET -->
<div class="ov-modal" id="ovDetailModal">
  <div class="sheet">
    <div class="rc">
      <div class="rc-i" id="ovRcIcon"><i class="ph ph-receipt"></i></div>
      <div class="rc-a num" id="ovRcAmt">₦0</div>
      <span class="rc-s success" id="ovRcStatus">Success</span>
    </div>
    <div class="rows" id="ovRcRows"></div>
    <button class="btn" onclick="closeModal('ovDetailModal')">Close</button>
  </div>
</div>

<div id="ov-toast-container"></div>
<div class="ov-loader" id="ovLoader"><div class="rg"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqXdfRRQZbbrB4DIpTAj45FkxJsXm3JrM",
  authDomain: "vexa-c0868.firebaseapp.com",
  projectId: "vexa-c0868",
  storageBucket: "vexa-c0868.firebasestorage.app",
  messagingSenderId: "209201666488",
  appId: "1:209201666488:web:ae6d16fec94097e719174d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

const S = window._state = { user:null, username:null, userDoc:null, all:[], view:[], dir:'all', type:'all', range:'all', q:'', page:1, per:20 };

// ================== HELPERS ==================
const DAY = 86400000, WAT = 3600000;
const dayNum = t => Math.floor((t + WAT) / DAY);
const toMs = v => !v ? 0 : v.toDate ? v.toDate().getTime() : new Date(v).getTime();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '₦' + (Number(n)||0).toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2});
const TZ = 'Africa/Lagos';
const lc = t => String(t.type || '').toLowerCase();

const TYPES = [
  { key:'all',        label:'All types',    test:() => true },
  { key:'deposit',    label:'Deposits',     test:t => lc(t).includes('deposit') },
  { key:'withdraw',   label:'Withdrawals',  test:t => lc(t).includes('withdraw') },
  { key:'investment', label:'Investments',  test:t => lc(t).includes('invest') },
  { key:'roi',        label:'ROI',          test:t => lc(t).includes('roi') || lc(t).includes('earning') },
  { key:'referral',   label:'Referrals',    test:t => lc(t).includes('referral') },
  { key:'spin',       label:'Spin',         test:t => lc(t).includes('spin') }
];

// Money OUT: withdrawals, fees, and plan purchases (not "Investment Completed")
const isDebit = t => { const x = lc(t); return x.includes('withdraw') || x.includes('fee') || (x.includes('invest') && !x.includes('completed')); };
const statusClass = t => { const s = String(t.status || 'Success').toLowerCase(); return s.includes('pend') ? 'pending' : (s.includes('fail') || s.includes('reject')) ? 'failed' : 'success'; };
const counted = t => statusClass(t) !== 'failed';
function iconFor(type){
  const t = String(type || '').toLowerCase();
  if(t.includes('deposit')) return ['dep','ph-arrow-down-left'];
  if(t.includes('withdraw')) return ['wd','ph-arrow-up-right'];
  if(t.includes('roi') || t.includes('earning')) return ['roi','ph-trend-up'];
  if(t.includes('spin')) return ['spin','ph-gift'];
  if(t.includes('invest')) return ['inv','ph-chart-line-up'];
  if(t.includes('referral')) return ['ref','ph-users-three'];
  return ['dep','ph-receipt'];
}
const timeOf = ms => new Date(ms).toLocaleTimeString('en-NG',{hour:'numeric',minute:'2-digit',timeZone:TZ});
const fullDate = ms => ms ? new Date(ms).toLocaleDateString('en-NG',{year:'numeric',month:'short',day:'numeric',timeZone:TZ}) + ' · ' + timeOf(ms) : '—';
function dayLabel(ms){
  const d = dayNum(ms), t = dayNum(Date.now());
  if(d === t) return 'Today';
  if(d === t - 1) return 'Yesterday';
  return new Date(ms).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:TZ});
}

// ================== TOAST ==================
function ovNotify(type, message){
  const c = $('ov-toast-container');
  const th = ({ success:['ph-check-circle','#3EE8A8'], error:['ph-x-circle','#FF6B7A'], warning:['ph-warning-circle','#F4C97A'], info:['ph-info','#5B8DEF'] })[type] || ['ph-info','#5B8DEF'];
  while(c.children.length >= 3) c.firstChild.remove();
  const t = document.createElement('div');
  t.className = 'ov-toast'; t.style.setProperty('--c', th[1]);
  t.innerHTML = `<i class="ph ${th[0]}"></i><span class="m"></span><span class="tb"></span>`;
  t.querySelector('.m').textContent = message;
  const kill = () => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); };
  t.addEventListener('click', kill);
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(kill, 4200);
}

// ================== AUTH GUARD ==================
onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href = 'login.html'; return; }
  S.user = user;
  await bootstrap();
});

async function bootstrap(){
  try{
    let username = sessionStorage.getItem('username');
    if(!username){
      const map = await getDoc(doc(db,'usersByUid', S.user.uid));
      if(map.exists()) username = map.data().username;
    }
    if(!username) username = (sessionStorage.getItem('userEmail') || '').split('@')[0].toUpperCase();
    S.username = username;

    const us = await getDoc(doc(db,'users',username));
    if(us.exists()){ S.userDoc = us.data(); $('ovDepBal').textContent = fmt(S.userDoc.depositWallet || 0); }

    const tx = await getDoc(doc(db,'transactionHistory',username));
    const list = tx.exists() && Array.isArray(tx.data().transactions) ? tx.data().transactions : [];
    S.all = list.map(t => ({ ...t, _ms: toMs(t.timestamp) })).sort((a,b) => b._ms - a._ms).map((t,i) => ({ ...t, _i:i }));

    renderSummary();
    renderTypeOpts();
    apply();
  }catch(err){
    console.error('Bootstrap error:', err);
    $('ovList').innerHTML = '<div class="empty"><i class="ph ph-warning-circle"></i><b>Failed to load</b>Please refresh the page</div>';
  }finally{
    $('ovLoader').classList.add('hide');
  }
}

// ================== SUMMARY (in / out only) ==================
function renderSummary(){
  let tin = 0, tout = 0;
  S.all.forEach(t => {
    if(!counted(t)) return;
    const a = Number(t.amount) || 0;
    if(a <= 0) return;
    if(isDebit(t)) tout += a; else tin += a;
  });
  $('ovIn').textContent = fmt(tin);
  $('ovOut').textContent = fmt(tout);
  const sum = tin + tout;
  $('ovBarA').style.width = sum ? (tin / sum * 100) + '%' : '0';
  $('ovBarB').style.width = sum ? (tout / sum * 100) + '%' : '0';
}

// ================== FILTERS ==================
function renderTypeOpts(){
  $('ovTypeOpts').innerHTML = TYPES.map(ty => {
    const n = ty.key === 'all' ? S.all.length : S.all.filter(ty.test).length;
    return `<button class="op ${S.type === ty.key ? 'on' : ''}" data-type="${ty.key}">${ty.label} <small>${n}</small></button>`;
  }).join('');
}

function apply(){
  const typeTest = TYPES.find(t => t.key === S.type).test;
  const now = Date.now(), today = dayNum(now), q = S.q.toLowerCase();
  S.view = S.all.filter(t => {
    const a = Number(t.amount) || 0;
    if(S.dir === 'in' && !(a > 0 && !isDebit(t))) return false;
    if(S.dir === 'out' && !(a > 0 && isDebit(t))) return false;
    if(!typeTest(t)) return false;
    if(S.range === 'today' && dayNum(t._ms) !== today) return false;
    if((S.range === '7' || S.range === '30') && t._ms < now - Number(S.range) * DAY) return false;
    if(q && !(`${t.type || ''} ${t.note || ''} ${t.reference || ''} ${t.amount || ''}`.toLowerCase().includes(q))) return false;
    return true;
  });
  S.page = 1;
  renderActive();
  renderList();
}

function renderActive(){
  const chips = [];
  if(S.type !== 'all') chips.push(['type', TYPES.find(t => t.key === S.type).label]);
  if(S.range !== 'all') chips.push(['range', S.range === 'today' ? 'Today' : `Last ${S.range} days`]);
  $('ovActive').innerHTML = chips.map(([k,l]) => `<button class="af" data-clear="${k}">${esc(l)} <i class="ph ph-x"></i></button>`).join('');
  const b = $('ovFilterBdg');
  b.textContent = chips.length;
  b.classList.toggle('show', chips.length > 0);
  $('ovFilterBtn').classList.toggle('on', chips.length > 0);
  $('ovApplyTxt').textContent = `Show ${S.view.length} result${S.view.length === 1 ? '' : 's'}`;
  $('ovSub').textContent = `${S.view.length} transaction${S.view.length === 1 ? '' : 's'}`;
}

function resetFilters(){
  S.type = 'all'; S.range = 'all';
  document.querySelectorAll('#ovRangeOpts .op').forEach(o => o.classList.toggle('on', o.dataset.range === 'all'));
  renderTypeOpts(); apply();
}
window.resetFilters = resetFilters;

// ================== RENDER LEDGER ==================
function renderList(){
  const wrap = $('ovList');
  if(!S.view.length){
    const filtered = S.q || S.type !== 'all' || S.range !== 'all' || S.dir !== 'all';
    wrap.innerHTML = `<div class="empty"><i class="ph ph-receipt"></i><b>${filtered ? 'No matches' : 'No transactions yet'}</b>${filtered ? 'Try changing your filters' : 'Your activity will appear here'}${filtered ? '<br><button onclick="clearAll()">Clear filters</button>' : ''}</div>`;
    return;
  }
  const visible = S.view.slice(0, S.page * S.per);
  const groups = [];
  visible.forEach(t => {
    const label = dayLabel(t._ms);
    const g = groups[groups.length - 1];
    if(g && g.label === label) g.items.push(t); else groups.push({ label, items:[t] });
  });

  let html = groups.map(g => `
    <section class="day">
      <div class="day-h"><span>${esc(g.label)}</span><span>${g.items.length}</span></div>
      <div class="led">${g.items.map(rowHtml).join('')}</div>
    </section>`).join('');

  html += visible.length < S.view.length
    ? `<button class="more" onclick="loadMore()"><i class="ph ph-arrow-down"></i> Load more (${S.view.length - visible.length})</button><div class="foot">Showing ${visible.length} of ${S.view.length}</div>`
    : `<div class="foot">Showing all ${S.view.length} transaction${S.view.length === 1 ? '' : 's'}</div>`;
  wrap.innerHTML = html;
}

function rowHtml(t){
  const [cls, icon] = iconFor(t.type), a = Number(t.amount) || 0, debit = isDebit(t), st = statusClass(t);
  const sub = t._ms ? timeOf(t._ms) + (t.note ? ' · ' + t.note : '') : (t.note || '');
  return `
    <div class="row" data-i="${t._i}">
      <div class="ri ${cls}"><i class="ph ${icon}"></i></div>
      <div class="rb"><b>${esc(t.type || 'Transaction')}</b><small>${esc(sub)}</small></div>
      <div class="ra">
        <div class="am num ${a === 0 ? 'zero' : debit ? 'neg' : 'pos'}">${a === 0 ? '' : debit ? '-' : '+'}${fmt(a)}</div>
        ${st === 'success' ? '' : `<div class="stt ${st}">${esc(t.status || '')}</div>`}
      </div>
    </div>`;
}

function loadMore(){ S.page++; renderList(); }
window.loadMore = loadMore;

function clearAll(){
  S.dir = 'all'; S.type = 'all'; S.range = 'all'; S.q = '';
  $('ovSearchInput').value = ''; $('ovSearchClr').classList.remove('show');
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.dir === 'all'));
  $('ovSegI').style.transform = 'translateX(0)';
  document.querySelectorAll('#ovRangeOpts .op').forEach(o => o.classList.toggle('on', o.dataset.range === 'all'));
  renderTypeOpts(); apply();
}
window.clearAll = clearAll;

// ================== RECEIPT ==================
function openDetail(i){
  const t = S.all[i]; if(!t) return;
  const [cls, icon] = iconFor(t.type), a = Number(t.amount) || 0, debit = isDebit(t), st = statusClass(t);
  $('ovRcIcon').className = 'rc-i ' + cls;
  $('ovRcIcon').innerHTML = `<i class="ph ${icon}"></i>`;
  const amt = $('ovRcAmt');
  amt.textContent = (a === 0 ? '' : debit ? '-' : '+') + fmt(a);
  amt.className = 'rc-a num ' + (a === 0 ? '' : debit ? 'neg' : 'pos');
  const s = $('ovRcStatus');
  s.textContent = t.status || 'Success';
  s.className = 'rc-s ' + st;

  const id = t.id || ('tx_' + t._ms);
  const rows = [
    ['Type', esc(t.type || '—')],
    ['Amount', fmt(a)],
    ['Date', esc(fullDate(t._ms))],
    t.note ? ['Note', esc(t.note)] : null,
    t.reference ? ['Reference', esc(t.reference), t.reference] : null,
    ['Transaction ID', esc(id), id]
  ].filter(Boolean);
  $('ovRcRows').innerHTML = rows.map(([k,v,copy]) => `
    <div class="rr"><span class="k">${k}</span><span class="v">${v}${copy ? `<button class="cp" data-copy="${esc(copy)}" aria-label="Copy"><i class="ph ph-copy"></i></button>` : ''}</span></div>`).join('');
  openModal('ovDetailModal');
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    ovNotify('success','Copied');
  }catch(e){ ovNotify('warning','Copy failed'); }
}

// ================== EVENTS ==================
$('ovList').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if(row) openDetail(Number(row.dataset.i));
});
$('ovRcRows').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if(b) copyText(b.dataset.copy);
});

document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const order = ['all','in','out'];
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  $('ovSegI').style.transform = `translateX(${order.indexOf(b.dataset.dir) * 100}%)`;
  S.dir = b.dataset.dir; apply();
});

$('ovFilterBtn').addEventListener('click', () => openModal('ovFilterModal'));
$('ovTypeOpts').addEventListener('click', e => {
  const b = e.target.closest('.op'); if(!b) return;
  S.type = b.dataset.type; renderTypeOpts(); apply();
});
$('ovRangeOpts').addEventListener('click', e => {
  const b = e.target.closest('.op'); if(!b) return;
  S.range = b.dataset.range;
  document.querySelectorAll('#ovRangeOpts .op').forEach(o => o.classList.toggle('on', o === b));
  apply();
});
$('ovActive').addEventListener('click', e => {
  const b = e.target.closest('[data-clear]'); if(!b) return;
  if(b.dataset.clear === 'type') S.type = 'all';
  else { S.range = 'all'; document.querySelectorAll('#ovRangeOpts .op').forEach(o => o.classList.toggle('on', o.dataset.range === 'all')); }
  renderTypeOpts(); apply();
});

// search
$('ovSearchBtn').addEventListener('click', () => {
  const open = $('ovSearch').classList.toggle('open');
  $('ovSearchBtn').classList.toggle('on', open || !!S.q);
  if(open) $('ovSearchInput').focus();
});
let searchTimer;
$('ovSearchInput').addEventListener('input', function(){
  S.q = this.value.trim();
  $('ovSearchClr').classList.toggle('show', S.q.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(apply, 150);
});
$('ovSearchClr').addEventListener('click', () => {
  $('ovSearchInput').value = ''; S.q = ''; $('ovSearchClr').classList.remove('show'); apply();
});

// modals
function openModal(id){ $(id)?.classList.add('open'); }
function closeModal(id){ $(id)?.classList.remove('open'); }
window.openModal = openModal;
window.closeModal = closeModal;
document.querySelectorAll('.ov-modal').forEach(m => m.addEventListener('click', e => { if(e.target === m) closeModal(m.id); }));
document.addEventListener('keydown', e => { if(e.key === 'Escape') ['ovFilterModal','ovDetailModal'].forEach(closeModal); });
window.ovNotify = ovNotify;
</script>
</body>
</html>
