<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Ovexa — Sign In</title>

<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta name="theme-color" content="#070B14">

<style>
:root{
  --ov-bg:#070B14;
  --ov-panel:#0F1524;
  --ov-panel-2:#141B2E;
  --ov-line:rgba(255,255,255,0.07);
  --ov-line-2:rgba(255,255,255,0.12);
  --ov-text:#EEF3FF;
  --ov-muted:#7C87A3;
  --ov-muted-2:#5A6478;
  --ov-accent:#3EE8A8;
  --ov-accent-2:#19B98B;
  --ov-gold:#F4C97A;
  --ov-danger:#FF6B7A;
  --ov-blue:#5B8DEF;
}
html,body{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--ov-bg);color:var(--ov-text)}
*,*::before,*::after{box-sizing:inherit}
body{display:flex;flex-direction:column;min-height:100vh;position:relative;overflow-x:hidden}

/* ============ AMBIENT BACKGROUND ============ */
.ov-bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(1200px 600px at 50% -10%,rgba(62,232,168,0.10),transparent 60%),
  radial-gradient(900px 500px at 100% 100%,rgba(91,141,239,0.08),transparent 60%),
  linear-gradient(180deg,#070B14 0%,#0A0F1C 100%)}
.ov-grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%)}
.ov-orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.5;will-change:transform}
.ov-orb-a{width:460px;height:460px;background:radial-gradient(circle,rgba(62,232,168,0.9) 0%,transparent 70%);top:-160px;right:-160px;animation:ovFloatA 14s ease-in-out infinite}
.ov-orb-b{width:420px;height:420px;background:radial-gradient(circle,rgba(91,141,239,0.8) 0%,transparent 70%);bottom:-180px;left:-140px;animation:ovFloatB 18s ease-in-out infinite}
.ov-orb-c{width:320px;height:320px;background:radial-gradient(circle,rgba(244,201,122,0.35) 0%,transparent 70%);top:40%;left:60%;animation:ovFloatA 22s ease-in-out infinite reverse}
@keyframes ovFloatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,32px) scale(1.08)}}
@keyframes ovFloatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-24px) scale(1.1)}}
.ov-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.5) 100%);pointer-events:none}

/* ============ SHELL ============ */
.ov-shell{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;position:relative;z-index:1;padding:0}

/* ============ TOP BANNER (ovexa.png) ============ */
.ov-banner{position:relative;width:100%;height:210px;overflow:hidden;background:#0A0F1C;animation:ovBannerIn .9s cubic-bezier(.2,.9,.3,1.1) both;border-radius:0 0 28px 28px}
@keyframes ovBannerIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.ov-banner img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:brightness(0.78) saturate(1.1)}
.ov-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,0.45) 0%,rgba(7,11,20,0.6) 45%,rgba(7,11,20,0.98) 100%);pointer-events:none}
.ov-banner-inner{position:absolute;left:0;right:0;bottom:0;padding:22px 24px;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ov-banner-title{font-family:'Space Grotesk';font-size:22px;font-weight:700;letter-spacing:-0.6px;color:#fff;line-height:1.2;margin:0}
.ov-banner-sub{font-size:11.5px;color:rgba(255,255,255,0.72);margin:4px 0 0;font-weight:500}
.ov-banner-link{font-size:11.5px;font-weight:700;letter-spacing:0.4px;color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;background:rgba(7,11,20,0.7);border:1px solid rgba(255,255,255,0.14);backdrop-filter:blur(10px);transition:all .25s;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.ov-banner-link:hover{background:rgba(62,232,168,0.2);border-color:rgba(62,232,168,0.55);color:var(--ov-accent);transform:translateY(-1px)}

/* ============ CONTENT ============ */
.ov-content{padding:0 22px 36px}

/* ============ HEADING ============ */
.ov-heading{margin:26px 0 22px;animation:ovFadeUp .8s cubic-bezier(.2,.9,.3,1.1) .1s both}
.ov-heading .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--ov-accent);padding:6px 12px;border-radius:999px;background:rgba(62,232,168,0.08);border:1px solid rgba(62,232,168,0.22);margin-bottom:14px}
.ov-heading .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--ov-accent);box-shadow:0 0 10px var(--ov-accent);animation:ovPulse 1.8s ease-in-out infinite}
@keyframes ovPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.4)}}
.ov-heading h1{font-family:'Space Grotesk';font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-1.1px;margin:0 0 10px;color:var(--ov-text)}
.ov-heading h1 .grad{background:linear-gradient(110deg,#3EE8A8 0%,#7DF0C7 45%,#F4C97A 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:ovShine 4s ease-in-out infinite}
@keyframes ovShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.ov-heading p{font-size:13px;color:var(--ov-muted);line-height:1.6;margin:0;max-width:420px}
@keyframes ovFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ============ FORM PANEL ============ */
.ov-form-panel{position:relative;animation:ovFadeUp .9s cubic-bezier(.2,.9,.3,1.1) .18s both}
.ov-form-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(62,232,168,0.35),transparent)}

/* ============ FIELDS ============ */
.ov-field{position:relative;margin-bottom:12px}
.ov-field .ov-label{position:absolute;top:50%;left:46px;transform:translateY(-50%);font-size:13px;font-weight:500;color:var(--ov-muted);pointer-events:none;transition:all .22s cubic-bezier(.2,.9,.3,1.2);padding:0 6px}
.ov-field input{width:100%;height:54px;padding:0 44px 0 46px;background:rgba(15,21,36,0.55);border:1.5px solid var(--ov-line);border-radius:12px;font-family:'Inter';font-size:13.5px;font-weight:500;color:var(--ov-text);outline:none;transition:all .25s}
.ov-field input::placeholder{color:transparent}
.ov-field input:hover{border-color:var(--ov-line-2)}
.ov-field input:focus{border-color:var(--ov-accent);background:rgba(7,11,20,0.95);box-shadow:0 0 0 4px rgba(62,232,168,0.10)}
.ov-field input:focus + .ov-label,
.ov-field input:not(:placeholder-shown) + .ov-label{top:0;left:14px;font-size:9.5px;font-weight:800;letter-spacing:0.9px;text-transform:uppercase;color:var(--ov-accent);background:var(--ov-bg);padding:0 7px;border-radius:4px}
.ov-field .ov-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ov-muted);font-size:1.12rem;pointer-events:none;transition:color .25s}
.ov-field input:focus ~ .ov-icon{color:var(--ov-accent)}

.ov-eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ov-muted);cursor:pointer;padding:8px;font-size:1.08rem;border-radius:9px;transition:all .2s;display:grid;place-items:center}
.ov-eye:hover{color:var(--ov-accent);background:rgba(62,232,168,0.08)}

/* Meta row */
.ov-meta-row{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 18px;font-size:12px}
.ov-remember{display:inline-flex;align-items:center;gap:8px;color:var(--ov-muted);font-weight:600;cursor:pointer;user-select:none}
.ov-remember input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ov-line-2);background:rgba(15,21,36,0.55);position:relative;cursor:pointer;transition:all .2s;outline:none;margin:0}
.ov-remember input:checked{background:linear-gradient(135deg,#3EE8A8,#19B98B);border-color:transparent}
.ov-remember input:checked::after{content:'';position:absolute;left:5px;top:1.5px;width:4px;height:8px;border:solid #04261A;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ov-forgot{color:var(--ov-accent);text-decoration:none;font-weight:700;font-size:12px;transition:opacity .2s}
.ov-forgot:hover{opacity:.8}

/* ============ BUTTONS ============ */
.ov-btn{position:relative;width:100%;height:54px;margin-top:4px;border:none;border-radius:13px;background:linear-gradient(135deg,#3EE8A8 0%,#19B98B 55%,#0E8E68 100%);background-size:200% 100%;color:#04261A;font-family:'Inter';font-size:14px;font-weight:800;letter-spacing:0.4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .3s;box-shadow:0 12px 26px rgba(62,232,168,0.28),inset 0 1px 0 rgba(255,255,255,0.28);overflow:hidden}
.ov-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.35) 50%,transparent 70%);transform:translateX(-100%);transition:transform .8s}
.ov-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 38px rgba(62,232,168,0.4),inset 0 1px 0 rgba(255,255,255,0.35);background-position:100% 50%}
.ov-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.ov-btn:active:not(:disabled){transform:translateY(0) scale(0.995)}
.ov-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

.ov-signup-btn{position:relative;width:100%;height:52px;margin-top:10px;border-radius:13px;background:rgba(255,255,255,0.03);border:1.5px solid var(--ov-line-2);color:var(--ov-text);font-family:'Inter';font-size:13px;font-weight:800;letter-spacing:0.4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .25s;text-decoration:none}
.ov-signup-btn:hover{background:rgba(91,141,239,0.10);border-color:rgba(91,141,239,0.4);color:var(--ov-blue);transform:translateY(-1px)}
.ov-signup-btn i{font-size:1.1rem}

.ov-spinner{width:16px;height:16px;border:2.5px solid rgba(4,38,26,0.25);border-top-color:#04261A;border-radius:50%;animation:ovSpin .7s linear infinite;display:inline-block}
@keyframes ovSpin{to{transform:rotate(360deg)}}

/* ============ FOOTER ============ */
.ov-foot{padding-top:22px;text-align:center;animation:ovFadeUp 1s cubic-bezier(.2,.9,.3,1.1) .3s both}
.ov-foot p{font-size:10.5px;color:var(--ov-muted-2);font-weight:600;letter-spacing:0.5px;margin:0}

/* ============ TOASTS ============ */
#ov-toast-container{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.ov-toast{background:linear-gradient(180deg,rgba(20,27,46,0.98),rgba(15,21,36,0.98));border:1px solid var(--ov-line-2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,0.6);display:flex;align-items:flex-start;padding:14px 15px;pointer-events:auto;transform:translateY(-28px) scale(0.96);opacity:0;transition:all .45s cubic-bezier(.68,-.55,.265,1.55);backdrop-filter:blur(14px)}
.ov-toast.show{transform:translateY(0) scale(1);opacity:1}
.ov-toast-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px;margin-right:12px;flex-shrink:0}
.ov-toast-body{flex:1;min-width:0}
.ov-toast-title{font-size:12.5px;font-weight:800;color:var(--ov-text);margin-bottom:3px;letter-spacing:0.2px}
.ov-toast-msg{font-size:11.5px;color:var(--ov-muted);line-height:1.5;word-wrap:break-word}
.ov-toast-close{background:none;border:none;color:var(--ov-muted-2);font-size:13px;cursor:pointer;padding:3px;border-radius:6px;transition:color .2s}
.ov-toast-close:hover{color:var(--ov-text)}

@media(max-width:380px){
  .ov-banner{height:180px}
  .ov-banner-title{font-size:19px}
  .ov-heading h1{font-size:26px}
  .ov-content{padding:0 16px 32px}
  .ov-field input{height:52px;font-size:13px}
  .ov-btn,.ov-signup-btn{height:52px}
}
</style>
</head>
<body>

<div class="ov-bg-layer">
  <div class="ov-grid"></div>
  <div class="ov-orb ov-orb-a"></div>
  <div class="ov-orb ov-orb-b"></div>
  <div class="ov-orb ov-orb-c"></div>
  <div class="ov-vignette"></div>
</div>

<main class="ov-shell">

  <!-- TOP BANNER -->
  <div class="ov-banner">
    <img src="ovexa.png" alt="Ovexa" onerror="this.style.display='none'">
    <div class="ov-banner-inner">
      <div>
        <p class="ov-banner-title">Welcome Back</p>
        <p class="ov-banner-sub">Sign in to continue</p>
      </div>
      <a href="index.html" class="ov-banner-link"><i class="ph ph-user-plus"></i> Sign Up</a>
    </div>
  </div>

  <div class="ov-content">

    <!-- HEADING -->
    <div class="ov-heading">
      <div class="eyebrow"><span class="dot"></span> Secure Access</div>
      <h1>Sign in to your <span class="grad">Ovexa account</span></h1>
      <p>Access your dashboard, manage your wallets, and continue growing your investments.</p>
    </div>

    <!-- FORM PANEL -->
    <div class="ov-form-panel">

      <form id="ovLoginForm" autocomplete="off" onsubmit="return false;">

        <!-- IDENTIFIER -->
        <div class="ov-field">
          <input type="text" id="identifier" placeholder=" " required autocomplete="username">
          <label class="ov-label" for="identifier">Email or Username</label>
          <i class="ph ph-user-circle ov-icon"></i>
        </div>

        <!-- PASSWORD -->
        <div class="ov-field">
          <input type="password" id="password" placeholder=" " required autocomplete="current-password">
          <label class="ov-label" for="password">Password</label>
          <i class="ph ph-lock-key ov-icon"></i>
          <button type="button" class="ov-eye" id="ovTogglePass"><i class="ph ph-eye" id="ovEyePass"></i></button>
        </div>

        <div class="ov-meta-row">
          <label class="ov-remember">
            <input type="checkbox" id="ovRemember">
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="ov-forgot">Forgot password?</a>
        </div>

        <button type="button" class="ov-btn" id="ovLoginBtn">
          <span id="ovBtnText">Sign In</span>
        </button>

        <a href="index.html" class="ov-signup-btn">
          <i class="ph ph-user-plus"></i> New to Ovexa? Create Account
        </a>

      </form>
    </div>

    <div class="ov-foot">
      <p>© Ovexa — Grow with confidence</p>
    </div>

  </div>

</main>

<div id="ov-toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqXdfRRQZbbrB4DIpTAj45FkxJsXm3JrM",
  authDomain: "vexa-c0868.firebaseapp.com",
  projectId: "vexa-c0868",
  storageBucket: "vexa-c0868.firebasestorage.app",
  messagingSenderId: "209201666488",
  appId: "1:209201666488:web:ae6d16fec94097e719174d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window._auth = auth;
window._db = db;
window._fbFns = { doc, getDoc, updateDoc, serverTimestamp, signInWithEmailAndPassword, signOut };
window._firebaseReady = true;
console.log('✅ Ovexa Firebase ready (login)');
</script>

<script>
"use strict";

function ovNotify(type, message){
  let container = document.getElementById('ov-toast-container');
  if(!container){ container = document.createElement('div'); container.id = 'ov-toast-container'; document.body.appendChild(container); }
  const themes = {
    success:{ icon:'fa-solid fa-check-double', color:'#3EE8A8', bg:'rgba(62,232,168,0.12)', title:'Success' },
    error:{ icon:'fa-solid fa-circle-exclamation', color:'#FF6B7A', bg:'rgba(255,107,122,0.12)', title:'Error' },
    warning:{ icon:'fa-solid fa-triangle-exclamation', color:'#F4C97A', bg:'rgba(244,201,122,0.12)', title:'Notice' },
    info:{ icon:'fa-solid fa-bell', color:'#5B8DEF', bg:'rgba(91,141,239,0.12)', title:'Info' }
  };
  const th = themes[type] || themes.info;
  const toast = document.createElement('div');
  toast.className = 'ov-toast';
  toast.style.borderLeft = `3px solid ${th.color}`;
  toast.innerHTML = `
    <div class="ov-toast-icon" style="color:${th.color};background:${th.bg}"><i class="${th.icon}"></i></div>
    <div class="ov-toast-body">
      <div class="ov-toast-title">${th.title}</div>
      <div class="ov-toast-msg">${message}</div>
    </div>
    <button class="ov-toast-close" onclick="this.closest('.ov-toast').remove()"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(toast);
  setTimeout(()=>toast.classList.add('show'), 10);
  setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(), 350); }, 5200);
}

function ovTogglePass(inputId, iconId){
  const inp = document.getElementById(inputId), ic = document.getElementById(iconId);
  if(!inp || !ic) return;
  if(inp.type === 'password'){ inp.type = 'text'; ic.className = 'ph ph-eye-slash'; }
  else { inp.type = 'password'; ic.className = 'ph ph-eye'; }
}
document.getElementById('ovTogglePass').addEventListener('click', ()=>ovTogglePass('password','ovEyePass'));

function setLoading(l){
  const b = document.getElementById('ovLoginBtn'), t = document.getElementById('ovBtnText');
  b.disabled = l;
  t.innerHTML = l ? '<span class="ov-spinner"></span> Signing In…' : 'Sign In';
}

async function handleLogin(){
  if(!window._firebaseReady || !window._db || !window._auth){
    return ovNotify('info','App is still loading, please wait…');
  }

  const identifier = document.getElementById('identifier').value.trim();
  const pass = document.getElementById('password').value;
  const remember = document.getElementById('ovRemember').checked;

  if(!identifier || !pass) return ovNotify('error','Please fill in all fields.');

  setLoading(true);

  const { doc, getDoc, updateDoc, serverTimestamp, signInWithEmailAndPassword } = window._fbFns;
  const db = window._db, auth = window._auth;

  try{
    let emailToUse = identifier;
    let usernameLookup = null;

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier)){
      usernameLookup = identifier.toUpperCase();
      const us = await getDoc(doc(db,'users',usernameLookup));
      if(!us.exists()){
        setLoading(false);
        return ovNotify('error','No account found with that username.');
      }
      const data = us.data();
      if(!data.email){
        setLoading(false);
        return ovNotify('error','This account has no linked email.');
      }
      emailToUse = data.email;
    }

    const cred = await signInWithEmailAndPassword(auth, emailToUse, pass);
    const uid = cred.user.uid;

    let userSnap = null;
    let userDoc = null;

    if(usernameLookup){
      userSnap = await getDoc(doc(db,'users',usernameLookup));
      userDoc = userSnap.exists() ? userSnap.data() : null;
    } else {
      const mapSnap = await getDoc(doc(db,'usersByUid',uid));
      if(mapSnap.exists()){
        const uname = mapSnap.data().username;
        if(uname){
          userSnap = await getDoc(doc(db,'users',uname));
          userDoc = userSnap.exists() ? userSnap.data() : null;
        }
      }
    }

    if(!userDoc){
      const mapSnap2 = await getDoc(doc(db,'usersByUid',uid));
      if(mapSnap2.exists()){
        const uname = mapSnap2.data().username;
        if(uname){
          const s = await getDoc(doc(db,'users',uname));
          if(s.exists()) userDoc = s.data();
        }
      }
    }

    if(!userDoc){
      console.warn('⚠️ User document not found; proceeding with minimal session.');
    }

    const username = userDoc?.username || identifier.toUpperCase();
    const email = userDoc?.email || emailToUse;
    const depositWallet = Number(userDoc?.depositWallet ?? 0);
    const withdrawalWallet = Number(userDoc?.withdrawalWallet ?? 0);
    const totalDeposited = Number(userDoc?.totalDeposited ?? 0);
    const totalWithdrawn = Number(userDoc?.totalWithdrawn ?? 0);
    const referralCount = Number(userDoc?.referralCount ?? 0);
    const referralBonus = Number(userDoc?.referralBonus ?? 0);
    const activePlan = userDoc?.activePlan ?? '';
    const isAdmin = !!userDoc?.isAdmin;

    try{
      if(userDoc?.username){
        await updateDoc(doc(db,'users',userDoc.username), { lastLogin: serverTimestamp() });
      }
    }catch(e){ console.warn('lastLogin update failed:', e); }

    const sessionData = {
      username, email,
      depositWallet,
      withdrawalWallet,
      totalDeposited,
      totalWithdrawn,
      referralCount,
      referralBonus,
      activePlan,
      isAdmin
    };

    sessionStorage.setItem('userLoggedIn','true');
    sessionStorage.setItem('userEmail', email);
    sessionStorage.setItem('userUid', uid);
    sessionStorage.setItem('username', username);
    sessionStorage.setItem('userData', JSON.stringify(sessionData));

    if(remember){
      localStorage.setItem('ovRemember', 'true');
      localStorage.setItem('ovLastUser', username);
    } else {
      localStorage.removeItem('ovRemember');
      localStorage.removeItem('ovLastUser');
    }

    ovNotify('success', `Welcome back, ${username}! Redirecting…`);
    setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 1200);

  }catch(err){
    setLoading(false);
    console.error('❌ Login error:', err);
    const messages = {
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/wrong-password':'Incorrect password. Please try again.',
      'auth/user-not-found':'No account found with those details.',
      'auth/invalid-email':'That email address is invalid.',
      'auth/too-many-requests':'Too many attempts. Please wait and try again.',
      'auth/network-request-failed':'Network error. Check your connection.',
      'auth/user-disabled':'This account has been disabled.'
    };
    ovNotify('error', messages[err.code] || err.message || 'Sign in failed. Please try again.');
  }
}

// Prefill remembered username
(function prefill(){
  if(localStorage.getItem('ovRemember') === 'true'){
    const last = localStorage.getItem('ovLastUser');
    if(last){
      document.getElementById('identifier').value = last;
      document.getElementById('ovRemember').checked = true;
    }
  }
})();

document.getElementById('ovLoginBtn').addEventListener('click', function(e){
  e.preventDefault();
  handleLogin();
});
document.getElementById('ovLoginForm').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); handleLogin(); }
});

window.handleLogin = handleLogin;
window.ovNotify = ovNotify;
console.log('✅ Ovexa login ready');
</script>
